<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Revision Hub</title>
<style>
  :root {
    /* Cardboard background */
    --bg: #c9a878;
    --bg-deep: #a98453;
    --edge: #7d5a2c;
    --edge-soft: #a07a48;

    /* Ink + neutrals */
    --ink: #2a1f12;
    --ink-soft: #4a3a22;
    --muted: #8a6f48;
    --done-text: #6e6553;

    /* Accents */
    --teal: #4d8a87;
    --teal-deep: #3f6663;
    --coral: #c95c40;
    --danger: #b53e2e;

    /* Cream paper used by every "lifted paper" surface */
    --paper: #f5ecd9;
    --paper-cool: #ece2cc;

    /* Reusable layered offset shadow — lifted from the menu button.
       Edge browns near the surface, coral peeking on the outer slabs,
       a soft diffuse drop blur at the end. */
    --shadow-stack:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      8px 12px 14px rgba(40, 25, 5, 0.4);

    --shadow-stack-lift:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--edge),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral),
      8px 8px 0 var(--coral),
      12px 16px 18px rgba(40, 25, 5, 0.45);

    --shadow-stack-press:
      1px 1px 0 var(--edge),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral);

    /* Single dark slab — used by elements that want a lighter weight (menu panel) */
    --shadow-ink: 6px 6px 0 var(--ink);

    --radius: 0px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  /* Cardboard texture — paper grit + faint horizontal corrugation pulses */
  body::before {
    background-image:
      radial-gradient(circle at 18% 12%, rgba(255, 235, 200, 0.35), transparent 50%),
      radial-gradient(circle at 82% 88%, rgba(40, 20, 0, 0.32), transparent 50%),
      repeating-linear-gradient(
        0deg,
        rgba(60, 35, 10, 0.05) 0 1.4px,
        rgba(255, 235, 200, 0.025) 1.4px 2.6px,
        transparent 2.6px 7px
      ),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='2' stitchTiles='stitch' seed='4'/><feColorMatrix values='0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.45' numOctaves='2' stitchTiles='stitch' seed='5'/><feColorMatrix values='0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0 0.05  0 0 0 0.45 0'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
    background-size: auto, auto, auto, 160px 160px, 400px 400px;
    mix-blend-mode: multiply;
    opacity: 1;
  }
  /* Soft top-light vignette */
  body::after {
    background: linear-gradient(180deg, rgba(255,235,200,0.16) 0%, transparent 28%, transparent 72%, rgba(30,18,0,0.22) 100%);
    opacity: 1;
  }

  main, header, .menu-btn, .menu-panel, .modal-overlay {
    position: relative;
    z-index: 2;
  }

  main { }

  header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
    position: relative;
  }

  header h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--ink);
  }
  header h1::after {
    content: "";
    display: block;
    width: 80px;
    height: 4px;
    background: var(--coral);
    margin: 0.6rem auto 0;
    transform: rotate(-1.5deg);
  }

  header p {
    margin: 0.8rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-style: italic;
  }

  .sync-status {
    margin-top: 0.6rem;
    font-size: 0.7rem;
    color: var(--muted);
    min-height: 1.1em;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    transition: color 0.2s;
  }
  .sync-status[data-state="synced"] { color: var(--teal-deep); }
  .sync-status[data-state="syncing"] { color: var(--ink-soft); }
  .sync-status[data-state="offline"],
  .sync-status[data-state="error"] { color: var(--coral); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1rem 3rem;
  }

  .add-form {
    background: var(--paper);
    padding: 1.5rem;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow-stack);
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 1fr auto;
    gap: 0.85rem;
    align-items: end;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .add-form label {
    display: flex;
    flex-direction: column;
    font-size: 0.72rem;
    color: var(--ink);
    font-weight: 700;
    gap: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .add-form input {
    padding: 0.65rem 0.75rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    font-family: inherit;
    transition: box-shadow 0.12s, transform 0.12s;
  }

  .add-form input:focus {
    outline: none;
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--coral);
  }

  .add-form button {
    padding: 0.75rem 1.4rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 0;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: inherit;
    height: fit-content;
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral);
  }

  .add-form button:hover {
    transform: translate(-2px, -2px);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral);
  }
  .add-form button:active {
    transform: translate(2px, 2px);
    box-shadow: var(--shadow-stack-press);
  }

  .exams {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.75rem 1.5rem;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow-stack);
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* Editorial paper card — same shadow stack as the menu button */
  .exam-card {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 1.4rem 1.5rem 1.4rem;
    box-shadow: var(--shadow-stack);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.12s, box-shadow 0.12s;
    will-change: transform;
  }
  .exam-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-stack-lift);
    z-index: 5;
  }

  /* Urgent — inverts to ink slab with cream text, like the active HOME tab */
  .exam-card.urgent {
    background: var(--ink);
    color: var(--paper);
  }
  .exam-card.urgent .subject,
  .exam-card.urgent .exam-date,
  .exam-card.urgent .exam-duration,
  .exam-card.urgent .quote {
    color: var(--paper);
  }
  .exam-card.urgent .quote { border-top-color: rgba(245,236,217,0.25); }

  /* Done — keeps the cream sheet but greys it out */
  .exam-card.done {
    background: var(--paper-cool);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      6px 8px 12px rgba(40, 25, 5, 0.3);
    filter: grayscale(0.55);
  }
  .exam-card.done .subject,
  .exam-card.done .exam-date,
  .exam-card.done .countdown,
  .exam-card.done .exam-duration,
  .exam-card.done .quote {
    color: var(--done-text);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }

  .subject {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.45rem;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    word-break: break-word;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: rgba(200,84,71,0.15);
    color: var(--danger);
  }

  .exam-date {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .exam-duration {
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-bottom: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.45rem;
    margin-bottom: 1rem;
  }

  .time-unit {
    background: var(--ink);
    color: var(--paper);
    border-radius: 0;
    padding: 0.6rem 0.25rem;
    text-align: center;
    box-shadow: 3px 3px 0 var(--coral);
  }

  .exam-card.urgent .time-unit {
    background: var(--paper);
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--coral);
  }

  .exam-card.done .time-unit {
    background: var(--ink-soft);
    color: var(--paper-cool);
    box-shadow: 2px 2px 0 var(--edge);
  }

  .time-value {
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  .time-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.7;
    margin-top: 0.2rem;
  }

  .done-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    background: var(--ink);
    color: var(--paper);
    border-radius: 0;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 800;
    margin-bottom: 0.75rem;
    box-shadow: 2px 2px 0 var(--coral);
  }
  .exam-card.urgent .done-badge { background: var(--paper); color: var(--ink); }

  .quote {
    margin-top: auto;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
    padding-top: 0.75rem;
    border-top: 1.5px dashed rgba(28,35,49,0.2);
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .add-form {
      grid-template-columns: 1fr;
      transform: rotate(0deg);
    }
    header { padding: 2rem 1rem 1rem; }
    main { padding: 0 0.85rem 2rem; }
  }

  /* Menu button (top-right) */
  .menu-btn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    width: 50px;
    height: 50px;
    border-radius: 0;
    background: var(--ink);
    border: none;
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      8px 12px 14px rgba(40,25,5,0.4);
    color: var(--paper);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, box-shadow 0.12s;
  }

  .menu-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--edge),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral),
      8px 8px 0 var(--coral),
      12px 16px 18px rgba(40,25,5,0.45);
  }
  .menu-btn:active {
    transform: translate(2px, 2px);
    box-shadow:
      1px 1px 0 var(--edge),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral);
  }

  .menu-panel {
    position: fixed;
    top: 4.4rem;
    right: 1rem;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 0;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 0.5rem;
    z-index: 59;
    min-width: 170px;
    display: flex;
    flex-direction: column;
    transform: rotate(-1deg);
  }

  .menu-panel[hidden] { display: none; }

  .menu-panel button {
    background: transparent;
    border: none;
    text-align: left;
    padding: 0.65rem 0.85rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 0;
    cursor: pointer;
  }

  .menu-panel button:hover { background: rgba(28,35,49,0.08); }
  .menu-panel button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .view[hidden] { display: none; }

  .section-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 1rem;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    position: relative;
    padding-left: 1rem;
  }
  .section-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.35rem;
    width: 6px;
    height: 1.15em;
    background: var(--coral);
  }

  .section-title:not(:first-child) { margin-top: 2.5rem; }

  /* Settings exam list */
  .settings-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .settings-row {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-stack);
    display: flex;
    align-items: center;
    gap: 0.85rem;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .settings-row:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-stack-lift); }

  .settings-row.done { opacity: 0.6; filter: grayscale(0.45); }

  .settings-row-main {
    flex: 1;
    min-width: 0;
  }

  .settings-row-meta {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .settings-row-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 0 0 0.15rem;
    word-break: break-word;
  }

  .settings-row .delete-btn {
    font-size: 1.3rem;
    padding: 0.3rem 0.55rem;
  }

  /* Settings sub-nav */
  .settings-tabs {
    display: flex;
    gap: 0;
    background: var(--paper);
    padding: 0;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    box-shadow: var(--shadow-stack);
    margin-bottom: 2.5rem;
    width: fit-content;
  }

  .settings-tabs button {
    background: transparent;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 0;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .settings-tabs button + button { border-left: 1.5px solid var(--ink); }

  .settings-tabs button:hover { color: var(--ink); background: rgba(28,35,49,0.06); }

  .settings-tabs button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .subview[hidden] { display: none; }

  /* Quotes editor */
  .subview-intro {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 1rem;
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }

  .quotes-editor {
    width: 100%;
    min-height: 320px;
    padding: 1rem 1.1rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    resize: vertical;
    box-shadow: var(--shadow-stack);
    transition: box-shadow 0.12s, transform 0.12s;
  }

  .quotes-editor:focus {
    outline: none;
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-stack-lift);
  }

  .quotes-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.85rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  .quotes-actions button {
    padding: 0.75rem 1.35rem;
    border-radius: 0;
    border: 1.5px solid var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral);
  }
  .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-stack-lift); }
  .btn-primary:active { transform: translate(2px, 2px); box-shadow: var(--shadow-stack-press); }

  .btn-ghost { background: var(--paper); color: var(--danger); border-color: var(--danger); }
  .btn-ghost:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--danger); }
</style>
</head>
<body>
  <header>
    <h1 id="pageTitle">Revision Hub</h1>
    <p id="pageTagline">Stay calm. Stay prepared. Track every exam in one place.</p>
    <div class="sync-status" id="syncStatus"></div>
  </header>

  <main>
    <section class="view" id="homeView">
      <div class="exams" id="examsList"></div>
    </section>

    <section class="view" id="settingsView" hidden>
      <nav class="settings-tabs" role="tablist">
        <button type="button" data-subview="exams" class="active" role="tab">Exams</button>
        <button type="button" data-subview="quotes" role="tab">Quotes</button>
      </nav>

      <div class="subview" id="subviewExams">
        <h2 class="section-title">Add an Exam</h2>
        <form class="add-form" id="addForm" autocomplete="off">
          <label>
            Subject
            <input type="text" id="subjectInput" placeholder="e.g. Mathematics" required maxlength="60" />
          </label>
          <label>
            Date
            <input type="date" id="dateInput" required />
          </label>
          <label>
            Time (optional)
            <input type="time" id="timeInput" />
          </label>
          <label>
            Length
            <input type="time" id="durationInput" value="01:30" />
          </label>
          <button type="submit">Add Exam</button>
        </form>

        <h2 class="section-title">Your Exams</h2>
        <div class="settings-list" id="settingsExamsList"></div>
      </div>

      <div class="subview" id="subviewQuotes" hidden>
        <h2 class="section-title">Motivational Quotes</h2>
        <p class="subview-intro">One quote per line. Saving reshuffles the order used by the cards on the home screen.</p>
        <textarea class="quotes-editor" id="quotesEditor" spellcheck="false"></textarea>
        <div class="quotes-actions">
          <button type="button" class="btn-ghost" id="quotesReset">Reset to defaults</button>
          <button type="button" class="btn-primary" id="quotesSave">Save quotes</button>
        </div>
      </div>
    </section>
  </main>

  <button type="button" class="menu-btn" id="menuButton" aria-label="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
  <nav class="menu-panel" id="menuPanel" hidden>
    <button type="button" data-view="home">Home</button>
    <button type="button" data-view="settings">Settings</button>
  </nav>

<script>
(() => {
  const STORAGE_KEY = 'exam-countdown-exams';
  const QUOTES_KEY = 'exam-countdown-quotes';
  const SAVE_PASSWORD = 'Quack';
  const JSONBIN_BIN_ID = '69ee444c36566621a8f3a85f';
  const JSONBIN_KEY = '$2a$10$VLqtJYJNOq9KDHJ1u8TaXeUqazTjHr0q8P1HnPfOhl/LUJUoHQXNG';
  const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

  const DEFAULT_QUOTES = [
    "Success is the sum of small efforts repeated day in and day out.",
    "The expert in anything was once a beginner.",
    "Don't watch the clock; do what it does. Keep going.",
    "You don't have to be great to start, but you have to start to be great.",
    "Push yourself, because no one else is going to do it for you.",
    "Small steps every day lead to big results.",
    "Study hard, but remember: progress, not perfection.",
    "Believe you can and you're halfway there.",
    "The future depends on what you do today.",
    "Discipline is the bridge between goals and accomplishment.",
    "Every accomplishment starts with the decision to try.",
    "Your only limit is the amount of effort you're willing to put in.",
    "Hard work beats talent when talent doesn't work hard.",
    "The harder you work for something, the greater you'll feel when you achieve it.",
    "Don't let what you cannot do interfere with what you can do.",
    "Opportunities don't happen. You create them.",
    "Dream big. Work hard. Stay focused.",
    "Act as if what you do makes a difference. It does.",
    "Great things never come from comfort zones.",
    "A little progress each day adds up to big results."
  ];

  let QUOTES = DEFAULT_QUOTES.slice();

  const state = {
    exams: [],
    quoteOrder: []
  };

  const form = document.getElementById('addForm');
  const subjectInput = document.getElementById('subjectInput');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const durationInput = document.getElementById('durationInput');
  const examsList = document.getElementById('examsList');
  const settingsExamsList = document.getElementById('settingsExamsList');
  const homeView = document.getElementById('homeView');
  const settingsView = document.getElementById('settingsView');
  const menuButton = document.getElementById('menuButton');
  const menuPanel = document.getElementById('menuPanel');
  const pageTagline = document.getElementById('pageTagline');
  const settingsTabs = settingsView.querySelector('.settings-tabs');
  const subviewExams = document.getElementById('subviewExams');
  const subviewQuotes = document.getElementById('subviewQuotes');
  const quotesEditor = document.getElementById('quotesEditor');
  const quotesSave = document.getElementById('quotesSave');
  const quotesReset = document.getElementById('quotesReset');

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.exams = JSON.parse(raw);
    } catch (e) {
      state.exams = [];
    }
    try {
      const rawQuotes = localStorage.getItem(QUOTES_KEY);
      if (rawQuotes) {
        const parsed = JSON.parse(rawQuotes);
        if (Array.isArray(parsed) && parsed.length > 0) {
          QUOTES = parsed.map(String);
        }
      }
    } catch (e) { /* keep defaults */ }
    state.quoteOrder = shuffle([...Array(QUOTES.length).keys()]);
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.exams));
  }

  /* ===== Remote sync (JSONBin) ===== */
  const syncStatusEl = document.getElementById('syncStatus');
  let pushInFlight = false;
  let pendingChanges = false;

  function setSyncStatus(s, detail) {
    if (!syncStatusEl) return;
    const labels = {
      idle: '',
      syncing: '⟳ Syncing…',
      synced: '✓ Synced',
      offline: '⚠ Offline' + (detail ? ' — ' + detail : ' — using local data'),
      error: '⚠ Sync failed' + (detail ? ' — ' + detail : ' — saved locally')
    };
    syncStatusEl.dataset.state = s;
    syncStatusEl.textContent = labels[s] || '';
  }

  async function jsonbinRequest(url, init) {
    const res = await fetch(url, init);
    if (!res.ok) {
      let body = '';
      try { body = (await res.text()).slice(0, 160); } catch (e) { /* ignore */ }
      const err = new Error('HTTP ' + res.status + (body ? ' — ' + body : ''));
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  async function fetchRemote() {
    setSyncStatus('syncing');
    try {
      const data = await jsonbinRequest(JSONBIN_URL + '/latest', {
        headers: { 'X-Access-Key': JSONBIN_KEY }
      });
      const record = (data && data.record) ? data.record : data;
      if (record && Array.isArray(record.exams)) {
        state.exams = record.exams;
        save();
        render();
      }
      setSyncStatus('synced');
    } catch (e) {
      console.error('JSONBin fetch failed:', e);
      setSyncStatus('offline', e.message);
    }
  }

  async function pushRemote() {
    if (pushInFlight) {
      pendingChanges = true;
      return;
    }
    pushInFlight = true;
    setSyncStatus('syncing');
    try {
      await jsonbinRequest(JSONBIN_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': JSONBIN_KEY
        },
        body: JSON.stringify({ exams: state.exams })
      });
      setSyncStatus('synced');
    } catch (e) {
      console.error('JSONBin push failed:', e);
      setSyncStatus('error', e.message);
    } finally {
      pushInFlight = false;
      if (pendingChanges) {
        pendingChanges = false;
        pushRemote();
      }
    }
  }

  function saveQuotesToStorage() {
    localStorage.setItem(QUOTES_KEY, JSON.stringify(QUOTES));
  }

  function quoteForIndex(i) {
    return QUOTES[state.quoteOrder[i % QUOTES.length]];
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const hasTime = iso.includes('T') && !iso.endsWith('T00:00:00');
    const dateOpts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
    let out = d.toLocaleDateString(undefined, dateOpts);
    if (hasTime) {
      out += ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    return out;
  }

  function diffParts(targetMs, nowMs) {
    let diff = Math.max(0, targetMs - nowMs);
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
    const mins = Math.floor(diff / 60000); diff -= mins * 60000;
    const secs = Math.floor(diff / 1000);
    return { days, hours, mins, secs };
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDuration(mins) {
    if (!mins || mins <= 0) return '';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h && m) return `${h}h ${m}m`;
    if (h) return `${h}h`;
    return `${m}m`;
  }

  function formatFinishTime(startIso, durationMins) {
    if (!durationMins || durationMins <= 0) return '';
    const start = new Date(startIso);
    const finish = new Date(start.getTime() + durationMins * 60000);
    const sameDay = start.toDateString() === finish.toDateString();
    const timeStr = finish.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return timeStr;
    return finish.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + timeStr;
  }

  function parseDurationInput(value) {
    if (!value) return 0;
    const [h, m] = value.split(':').map(n => parseInt(n, 10) || 0);
    return h * 60 + m;
  }

  function addExam(subject, dateStr, timeStr, durationMins) {
    const iso = timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T09:00`;
    const exam = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      subject: subject.trim(),
      datetime: iso,
      durationMins: durationMins || 0
    };
    state.exams.push(exam);
    save();
    pushRemote();
    render();
  }

  function deleteExam(id) {
    state.exams = state.exams.filter(e => e.id !== id);
    save();
    pushRemote();
    render();
  }

  function render() {
    const now = Date.now();
    const sorted = [...state.exams].sort(
      (a, b) => new Date(a.datetime) - new Date(b.datetime)
    );

    if (sorted.length === 0) {
      examsList.innerHTML = '<div class="empty">No exams yet. Open the menu and go to Settings to add your first one.</div>';
    } else {
      examsList.innerHTML = '';
      sorted.forEach((exam, i) => {
        const target = new Date(exam.datetime).getTime();
        const isDone = target <= now;
        const msLeft = target - now;
        const isUrgent = !isDone && msLeft <= 7 * 86400000;

        const card = document.createElement('article');
        card.className = 'exam-card' + (isDone ? ' done' : (isUrgent ? ' urgent' : ''));
        card.dataset.target = target;

        const { days, hours, mins, secs } = diffParts(target, now);

        const durationStr = formatDuration(exam.durationMins);
        const finishStr = formatFinishTime(exam.datetime, exam.durationMins);
        const durationLine = durationStr
          ? `⏱ Length: <span class="dur-value"></span>${finishStr ? ' · Finishes <span class="finish-value"></span>' : ''}`
          : '';

        card.innerHTML = `
          <div class="card-header">
            <h2 class="subject"></h2>
          </div>
          ${isDone ? '<span class="done-badge">Done</span>' : ''}
          <div class="exam-date"></div>
          ${durationStr ? `<div class="exam-duration">${durationLine}</div>` : ''}
          <div class="countdown">
            <div class="time-unit"><span class="time-value" data-u="d">${days}</span><div class="time-label">Days</div></div>
            <div class="time-unit"><span class="time-value" data-u="h">${pad(hours)}</span><div class="time-label">Hours</div></div>
            <div class="time-unit"><span class="time-value" data-u="m">${pad(mins)}</span><div class="time-label">Mins</div></div>
            <div class="time-unit"><span class="time-value" data-u="s">${pad(secs)}</span><div class="time-label">Secs</div></div>
          </div>
          <p class="quote"></p>
        `;

        card.querySelector('.subject').textContent = exam.subject;
        card.querySelector('.exam-date').textContent = formatDate(exam.datetime);
        if (durationStr) {
          card.querySelector('.dur-value').textContent = durationStr;
          if (finishStr) card.querySelector('.finish-value').textContent = finishStr;
        }
        card.querySelector('.quote').textContent = '“' + quoteForIndex(i) + '”';

        examsList.appendChild(card);
      });
    }

    renderSettingsList(sorted);
  }

  function renderSettingsList(sorted) {
    if (!sorted.length) {
      settingsExamsList.innerHTML = '<div class="empty">No exams yet. Add one using the form above.</div>';
      return;
    }
    settingsExamsList.innerHTML = '';
    const now = Date.now();
    sorted.forEach(exam => {
      const target = new Date(exam.datetime).getTime();
      const isDone = target <= now;
      const durationStr = formatDuration(exam.durationMins);
      const row = document.createElement('div');
      row.className = 'settings-row' + (isDone ? ' done' : '');
      row.innerHTML = `
        <div class="settings-row-main">
          <p class="settings-row-title"></p>
          <div class="settings-row-meta"></div>
        </div>
        <button class="delete-btn" aria-label="Delete exam" title="Delete">&times;</button>
      `;
      row.querySelector('.settings-row-title').textContent = exam.subject;
      const metaParts = [formatDate(exam.datetime)];
      if (durationStr) metaParts.push(durationStr);
      const finishStr = formatFinishTime(exam.datetime, exam.durationMins);
      if (finishStr) metaParts.push('finishes ' + finishStr);
      if (isDone) metaParts.push('Done');
      row.querySelector('.settings-row-meta').textContent = metaParts.join(' · ');
      row.querySelector('.delete-btn').addEventListener('click', () => {
        if (window.confirm(`Delete "${exam.subject}"?`)) deleteExam(exam.id);
      });
      settingsExamsList.appendChild(row);
    });
  }

  function tick() {
    const now = Date.now();
    const cards = examsList.querySelectorAll('.exam-card');
    let needsRerender = false;

    cards.forEach(card => {
      const target = Number(card.dataset.target);
      const wasDone = card.classList.contains('done');
      const isDone = target <= now;

      if (isDone !== wasDone) {
        needsRerender = true;
        return;
      }
      if (isDone) return;

      const msLeft = target - now;
      const shouldBeUrgent = msLeft <= 7 * 86400000;
      if (shouldBeUrgent !== card.classList.contains('urgent')) {
        needsRerender = true;
        return;
      }

      const { days, hours, mins, secs } = diffParts(target, now);
      const values = card.querySelectorAll('.time-value');
      values[0].textContent = days;
      values[1].textContent = pad(hours);
      values[2].textContent = pad(mins);
      values[3].textContent = pad(secs);
    });

    if (needsRerender) render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const subject = subjectInput.value.trim();
    const date = dateInput.value;
    const time = timeInput.value;
    const duration = parseDurationInput(durationInput.value);
    if (!subject || !date) return;
    const pwd = window.prompt('Enter password to save this exam:');
    if (pwd === null) return;
    if (pwd !== SAVE_PASSWORD) {
      window.alert('Incorrect password. Exam not saved.');
      return;
    }
    addExam(subject, date, time, duration);
    form.reset();
    durationInput.value = '01:30';
    subjectInput.focus();
  });

  /* ===== View switching ===== */
  const TAGLINES = {
    home: 'Stay calm. Stay prepared. Track every exam in one place.',
    settings: 'Add or remove exams from your revision hub.'
  };

  function showView(name) {
    const isSettings = name === 'settings';
    homeView.hidden = isSettings;
    settingsView.hidden = !isSettings;
    pageTagline.textContent = TAGLINES[name] || TAGLINES.home;
    menuPanel.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.view === name);
    });
    if (isSettings) showSubview('exams');
    closeMenu();
  }

  function showSubview(name) {
    subviewExams.hidden = name !== 'exams';
    subviewQuotes.hidden = name !== 'quotes';
    settingsTabs.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.subview === name);
    });
    if (name === 'quotes') {
      quotesEditor.value = QUOTES.join('\n');
    }
  }

  settingsTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-subview]');
    if (btn) showSubview(btn.dataset.subview);
  });

  quotesSave.addEventListener('click', () => {
    const lines = quotesEditor.value
      .split('\n')
      .map(l => l.trim())
      .filter(Boolean);
    if (lines.length === 0) {
      window.alert('Please provide at least one quote.');
      return;
    }
    const pwd = window.prompt('Enter password to save quotes:');
    if (pwd === null) return;
    if (pwd !== SAVE_PASSWORD) {
      window.alert('Incorrect password. Quotes not saved.');
      return;
    }
    QUOTES = lines;
    saveQuotesToStorage();
    state.quoteOrder = shuffle([...Array(QUOTES.length).keys()]);
    render();
    window.alert('Quotes saved.');
  });

  quotesReset.addEventListener('click', () => {
    if (!window.confirm('Reset quotes to the original defaults? This will replace your current list.')) return;
    const pwd = window.prompt('Enter password to reset quotes:');
    if (pwd === null) return;
    if (pwd !== SAVE_PASSWORD) {
      window.alert('Incorrect password. Quotes not reset.');
      return;
    }
    QUOTES = DEFAULT_QUOTES.slice();
    saveQuotesToStorage();
    quotesEditor.value = QUOTES.join('\n');
    state.quoteOrder = shuffle([...Array(QUOTES.length).keys()]);
    render();
  });

  function openMenu() {
    menuPanel.hidden = false;
    menuButton.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    menuPanel.hidden = true;
    menuButton.setAttribute('aria-expanded', 'false');
  }

  menuButton.addEventListener('click', (e) => {
    e.stopPropagation();
    menuPanel.hidden ? openMenu() : closeMenu();
  });
  menuPanel.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (btn) showView(btn.dataset.view);
  });
  document.addEventListener('click', (e) => {
    if (!menuPanel.hidden && !menuPanel.contains(e.target) && e.target !== menuButton) {
      closeMenu();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });

  load();
  render();
  showView('home');
  setInterval(tick, 1000);
  fetchRemote();
  window.addEventListener('online', fetchRemote);
})();
</script>
</body>
</html>
