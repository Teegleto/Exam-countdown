<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Mate</title>
<style>
  :root {
    /* Cardboard background */
    --bg: #c9a878;
    --bg-deep: #a98453;
    --edge: #7d5a2c;
    --edge-soft: #a07a48;

    /* Ink + neutrals */
    --ink: #2a1f12;
    --ink-soft: #4a3a22;
    --muted: #8a6f48;
    --done-text: #6e6553;

    /* Accents */
    --teal: #4d8a87;
    --teal-deep: #3f6663;
    --coral: #c95c40;
    --mustard: #c89a3f;
    --plum: #704c5e;
    --danger: #b53e2e;

    /* Event colour palette (the five swatches) */
    --cal-ink: var(--ink);
    --cal-coral: var(--coral);
    --cal-teal: var(--teal);
    --cal-mustard: var(--mustard);
    --cal-plum: var(--plum);

    /* Cream paper used by every "lifted paper" surface */
    --paper: #f5ecd9;
    --paper-cool: #ece2cc;

    /* Reusable layered offset shadow — lifted from the menu button.
       Edge browns near the surface, coral peeking on the outer slabs,
       a soft diffuse drop blur at the end. */
    --shadow-stack:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      8px 12px 14px rgba(40, 25, 5, 0.4);

    --shadow-stack-lift:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--edge),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral),
      8px 8px 0 var(--coral),
      12px 16px 18px rgba(40, 25, 5, 0.45);

    --shadow-stack-press:
      1px 1px 0 var(--edge),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral);

    /* Single dark slab — used by elements that want a lighter weight (menu panel) */
    --shadow-ink: 6px 6px 0 var(--ink);

    --radius: 0px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  /* Cardboard texture — paper grit + faint horizontal corrugation pulses */
  body::before {
    background-image:
      radial-gradient(circle at 18% 12%, rgba(255, 235, 200, 0.35), transparent 50%),
      radial-gradient(circle at 82% 88%, rgba(40, 20, 0, 0.32), transparent 50%),
      repeating-linear-gradient(
        0deg,
        rgba(60, 35, 10, 0.05) 0 1.4px,
        rgba(255, 235, 200, 0.025) 1.4px 2.6px,
        transparent 2.6px 7px
      ),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.3' numOctaves='2' stitchTiles='stitch' seed='4'/><feColorMatrix values='0 0 0 0 0.24  0 0 0 0 0.14  0 0 0 0 0.04  0 0 0 0.32 0'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.45' numOctaves='2' stitchTiles='stitch' seed='5'/><feColorMatrix values='0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0 0.05  0 0 0 0.45 0'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
    background-size: auto, auto, auto, 160px 160px, 400px 400px;
    mix-blend-mode: multiply;
    opacity: 1;
  }
  /* Soft top-light vignette */
  body::after {
    background: linear-gradient(180deg, rgba(255,235,200,0.16) 0%, transparent 28%, transparent 72%, rgba(30,18,0,0.22) 100%);
    opacity: 1;
  }

  main, header, .menu-btn, .menu-panel, .modal-overlay {
    position: relative;
    z-index: 2;
  }

  main { }

  header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
    position: relative;
  }

  header h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.2rem, 5vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--ink);
  }
  header h1::after {
    content: "";
    display: block;
    width: 80px;
    height: 4px;
    background: var(--coral);
    margin: 0.6rem auto 0;
    transform: rotate(-1.5deg);
  }

  header p {
    margin: 0.8rem 0 0;
    color: var(--ink-soft);
    font-size: 0.95rem;
    font-style: italic;
  }

  .sync-status {
    margin-top: 0.6rem;
    font-size: 0.7rem;
    color: var(--muted);
    min-height: 1.1em;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    transition: color 0.2s;
  }
  .sync-status[data-state="synced"] { color: var(--teal-deep); }
  .sync-status[data-state="syncing"] { color: var(--ink-soft); }
  .sync-status[data-state="offline"],
  .sync-status[data-state="error"] { color: var(--coral); }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1rem 3rem;
  }

  .add-form {
    background: var(--paper);
    padding: 1.5rem;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow-stack);
    display: grid;
    grid-template-columns: 1.6fr 1fr 1fr 1fr auto;
    gap: 0.85rem;
    align-items: end;
    margin-bottom: 2.5rem;
    position: relative;
  }

  .add-form label {
    display: flex;
    flex-direction: column;
    font-size: 0.72rem;
    color: var(--ink);
    font-weight: 700;
    gap: 0.4rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .add-form input {
    padding: 0.65rem 0.75rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    font-family: inherit;
    transition: box-shadow 0.12s, transform 0.12s;
  }

  .add-form input:focus {
    outline: none;
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--coral);
  }

  .add-form button {
    padding: 0.75rem 1.4rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 0;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: inherit;
    height: fit-content;
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral);
  }

  .add-form button:hover {
    transform: translate(-2px, -2px);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral);
  }
  .add-form button:active {
    transform: translate(2px, 2px);
    box-shadow: var(--shadow-stack-press);
  }

  .exams {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.75rem 1.5rem;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow-stack);
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* Editorial paper card — same shadow stack as the menu button */
  .exam-card {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 1.4rem 1.5rem 1.4rem;
    box-shadow: var(--shadow-stack);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: transform 0.12s, box-shadow 0.12s;
    will-change: transform;
  }
  .exam-card:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-stack-lift);
    z-index: 5;
  }

  /* Urgent — inverts to ink slab with cream text, like the active HOME tab */
  .exam-card.urgent {
    background: var(--ink);
    color: var(--paper);
  }
  .exam-card.urgent .subject,
  .exam-card.urgent .exam-date,
  .exam-card.urgent .exam-duration,
  .exam-card.urgent .quote {
    color: var(--paper);
  }
  .exam-card.urgent .quote { border-top-color: rgba(245,236,217,0.25); }

  /* Done — keeps the cream sheet but greys it out */
  .exam-card.done {
    background: var(--paper-cool);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      6px 8px 12px rgba(40, 25, 5, 0.3);
    filter: grayscale(0.55);
  }
  .exam-card.done .subject,
  .exam-card.done .exam-date,
  .exam-card.done .countdown,
  .exam-card.done .exam-duration,
  .exam-card.done .quote {
    color: var(--done-text);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.25rem;
  }

  .subject {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.45rem;
    font-weight: 700;
    margin: 0;
    color: var(--ink);
    word-break: break-word;
    line-height: 1.05;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }

  .delete-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1.1rem;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: rgba(200,84,71,0.15);
    color: var(--danger);
  }

  .exam-date {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  .exam-duration {
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-bottom: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.45rem;
    margin-bottom: 1rem;
  }

  .time-unit {
    background: var(--ink);
    color: var(--paper);
    border-radius: 0;
    padding: 0.6rem 0.25rem;
    text-align: center;
    box-shadow: 3px 3px 0 var(--coral);
  }

  .exam-card.urgent .time-unit {
    background: var(--paper);
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--coral);
  }

  .exam-card.done .time-unit {
    background: var(--ink-soft);
    color: var(--paper-cool);
    box-shadow: 2px 2px 0 var(--edge);
  }

  .time-value {
    display: block;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.05;
    font-variant-numeric: tabular-nums;
  }

  .time-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0.7;
    margin-top: 0.2rem;
  }

  .done-badge {
    display: inline-block;
    font-size: 0.7rem;
    padding: 0.25rem 0.6rem;
    background: var(--ink);
    color: var(--paper);
    border-radius: 0;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 800;
    margin-bottom: 0.75rem;
    box-shadow: 2px 2px 0 var(--coral);
  }
  .exam-card.urgent .done-badge { background: var(--paper); color: var(--ink); }

  /* Done cards on the home view become click-to-dismiss */
  .exam-card.dismissable { cursor: pointer; position: relative; }
  .exam-card.dismissable::after {
    content: "Click to dismiss";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(42, 31, 18, 0.78);
    color: var(--paper);
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    opacity: 0;
    transition: opacity 0.18s ease;
    pointer-events: none;
  }
  .exam-card.dismissable:hover::after,
  .exam-card.dismissable:focus-visible::after { opacity: 1; }

  .quote {
    margin-top: auto;
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
    padding-top: 0.75rem;
    border-top: 1.5px dashed rgba(28,35,49,0.2);
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .add-form {
      grid-template-columns: 1fr;
      transform: rotate(0deg);
    }
    header { padding: 2rem 1rem 1rem; }
    main { padding: 0 0.85rem 2rem; }
  }

  /* Menu button (top-right) */
  .menu-btn {
    position: fixed;
    top: 1rem;
    right: 1rem;
    width: 50px;
    height: 50px;
    border-radius: 0;
    background: var(--ink);
    border: none;
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--coral),
      6px 6px 0 var(--coral),
      8px 12px 14px rgba(40,25,5,0.4);
    color: var(--paper);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s, box-shadow 0.12s;
  }

  .menu-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge-soft),
      3px 3px 0 var(--edge),
      4px 4px 0 var(--edge),
      5px 5px 0 var(--edge),
      6px 6px 0 var(--coral),
      7px 7px 0 var(--coral),
      8px 8px 0 var(--coral),
      12px 16px 18px rgba(40,25,5,0.45);
  }
  .menu-btn:active {
    transform: translate(2px, 2px);
    box-shadow:
      1px 1px 0 var(--edge),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral);
  }

  .menu-panel {
    position: fixed;
    top: 4.4rem;
    right: 1rem;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 0;
    box-shadow: 6px 6px 0 var(--ink);
    padding: 0.5rem;
    z-index: 59;
    min-width: 170px;
    display: flex;
    flex-direction: column;
    transform: rotate(-1deg);
  }

  .menu-panel[hidden] { display: none; }

  .menu-panel button {
    background: transparent;
    border: none;
    text-align: left;
    padding: 0.65rem 0.85rem;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border-radius: 0;
    cursor: pointer;
  }

  .menu-panel button:hover { background: rgba(28,35,49,0.08); }
  .menu-panel button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .view[hidden] { display: none; }

  .section-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 1rem;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    position: relative;
    padding-left: 1rem;
  }
  .section-title::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0.35rem;
    width: 6px;
    height: 1.15em;
    background: var(--coral);
  }

  .section-title:not(:first-child) { margin-top: 2.5rem; }

  /* Settings exam list */
  .settings-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .settings-row {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-stack);
    display: flex;
    align-items: center;
    gap: 0.85rem;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .settings-row:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-stack-lift); }

  .settings-row.done { opacity: 0.6; filter: grayscale(0.45); }

  .settings-row-main {
    flex: 1;
    min-width: 0;
  }

  .settings-row-meta {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .settings-row-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
    margin: 0 0 0.15rem;
    word-break: break-word;
  }

  .settings-row .delete-btn {
    font-size: 1.3rem;
    padding: 0.3rem 0.55rem;
  }
  .settings-row-actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .settings-row-actions .icon-btn {
    background: transparent;
    border: none;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 1.05rem;
    line-height: 1;
    transition: background 0.15s, color 0.15s;
  }
  .settings-row-actions .icon-btn:hover { color: var(--ink); background: rgba(28,31,18,0.07); }
  .settings-row-actions .icon-btn.danger:hover { color: var(--danger); background: rgba(200,84,71,0.12); }

  /* Settings sub-nav */
  .settings-tabs {
    display: flex;
    gap: 0;
    background: var(--paper);
    padding: 0;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    box-shadow: var(--shadow-stack);
    margin-bottom: 2.5rem;
    width: fit-content;
  }

  .settings-tabs button {
    background: transparent;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 0;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .settings-tabs button + button { border-left: 1.5px solid var(--ink); }

  .settings-tabs button:hover { color: var(--ink); background: rgba(28,35,49,0.06); }

  .settings-tabs button.active {
    background: var(--ink);
    color: var(--paper);
  }

  .subview[hidden] { display: none; }

  /* Quotes editor */
  .subview-intro {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin: 0 0 1rem;
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }

  .quotes-editor {
    width: 100%;
    min-height: 320px;
    padding: 1rem 1.1rem;
    border: 1.5px solid var(--ink);
    border-radius: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    resize: vertical;
    box-shadow: var(--shadow-stack);
    transition: box-shadow 0.12s, transform 0.12s;
  }

  .quotes-editor:focus {
    outline: none;
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-stack-lift);
  }

  .quotes-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.85rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  .quotes-actions button {
    padding: 0.75rem 1.35rem;
    border-radius: 0;
    border: 1.5px solid var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral);
  }
  .btn-primary:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-stack-lift); }
  .btn-primary:active { transform: translate(2px, 2px); box-shadow: var(--shadow-stack-press); }

  .btn-ghost { background: var(--paper); color: var(--danger); border-color: var(--danger); }
  .btn-ghost:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--danger); }

  /* ===== Calendar ===== */
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.4rem;
    flex-wrap: wrap;
    gap: 0.85rem 1.2rem;
  }
  .cal-mode-switch {
    display: flex;

    border: 1.5px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    width: fit-content;
  }
  .cal-mode-switch button {
    background: transparent;
    border: none;
    padding: 0.55rem 1.05rem;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    cursor: pointer;
    border-radius: 0;
  }
  .cal-mode-switch button + button { border-left: 1.5px solid var(--ink); }
  .cal-mode-switch button:hover { background: rgba(28,31,18,0.07); color: var(--ink); }
  .cal-mode-switch button.active { background: var(--ink); color: var(--paper); }
  .calendar-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .calendar-nav { display: flex; gap: 0.5rem; }
  .cal-nav-btn {
    padding: 0.55rem 0.95rem;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 0;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink);
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--coral);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .cal-nav-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--coral); }
  .cal-nav-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--coral); }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    margin-bottom: 1.6rem;
  }
  .calendar-dow {
    padding: 0.55rem 0.4rem;
    background: var(--ink);
    color: var(--paper);
    font-weight: 800;
    font-size: 0.65rem;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 0.14em;
  }
  .calendar-cell {
    padding: 0.4rem 0.45rem 0.45rem;
    height: 118px;
    border-right: 1px solid rgba(42,31,18,0.18);
    border-bottom: 1px solid rgba(42,31,18,0.18);
    cursor: pointer;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background 0.1s, color 0.1s;
    overflow: hidden;
  }
  .calendar-cell:nth-child(7n+7) { border-right: none; }
  .calendar-grid > .calendar-cell:nth-last-child(-n+7) { border-bottom: none; }
  .calendar-cell:hover { background: rgba(42,31,18,0.08); }
  .calendar-cell.muted { color: var(--muted); background: rgba(0,0,0,0.04); }
  .calendar-cell.muted:hover { background: rgba(0,0,0,0.08); }
  .calendar-cell .cal-cell-header {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 0.25rem;
  }
  .calendar-cell .day-num {
    font-weight: 800;
    font-size: 0.82rem;
    padding: 0.1rem 0.35rem;
    line-height: 1;
    border-radius: 0;
  }
  .calendar-cell.today .day-num {
    background: var(--coral);
    color: var(--paper);
  }
  .calendar-cell.selected {
    background: var(--ink);
    color: var(--paper);
  }
  .calendar-cell.selected.muted { color: var(--paper-cool); }
  .calendar-cell.selected:hover { background: var(--ink); }
  .calendar-cell.selected .day-num { color: var(--paper); background: transparent; }
  .calendar-cell.selected.today .day-num { background: var(--coral); color: var(--paper); }

  .cal-cell-events {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-right: 1px;
    scrollbar-width: thin;
    scrollbar-color: var(--edge) transparent;
  }
  .cal-cell-events::-webkit-scrollbar { width: 4px; }
  .cal-cell-events::-webkit-scrollbar-thumb { background: var(--edge); }
  .cal-cell-events::-webkit-scrollbar-track { background: transparent; }

  .cal-cell-event {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.15;
    min-height: 14px;
  }
  .cal-cell-event .event-dot {
    width: 7px; height: 7px;
    background: var(--ev-color, var(--ink));
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cal-cell-event-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .calendar-cell.selected .cal-cell-event { color: var(--paper); }
  .calendar-cell.selected .cal-cell-event .event-dot { box-shadow: 0 0 0 1px var(--paper); }

  .calendar-day-panel {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    padding: 1.25rem 1.4rem 1.4rem;
  }
  .calendar-day-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.85rem;
  }
  .calendar-day-panel-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.2rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .calendar-event-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .calendar-event-row {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 0.95rem;
    border: 1.5px solid var(--ink);
    background: var(--paper);
    box-shadow: 3px 3px 0 var(--coral);
  }
  .calendar-event-row.exam { background: #f0d99a; }
  .calendar-event-time {
    font-weight: 800;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    min-width: 3.4rem;
    color: var(--ink);
  }
  .calendar-event-title {
    flex: 1;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    color: var(--ink);
    word-break: break-word;
    min-width: 0;
  }
  .calendar-event-notes {
    display: block;
    font-family: inherit;
    font-weight: 400;
    font-style: italic;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }
  .calendar-event-badge {
    font-size: 0.6rem;
    padding: 0.18rem 0.5rem;
    background: var(--ink);
    color: var(--paper);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 800;
  }
  .calendar-event-actions { display: flex; gap: 0.3rem; }
  .calendar-event-actions .icon-btn {
    background: transparent;
    border: none;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 1.05rem;
  }
  .calendar-event-actions .icon-btn:hover { color: var(--ink); background: rgba(28,31,18,0.07); }
  .calendar-event-actions .icon-btn.danger:hover { color: var(--danger); background: rgba(200,84,71,0.12); }

  /* Coloured dot on event row + the row's coral shadow tinted by colour */
  .calendar-event-row { box-shadow: 3px 3px 0 var(--ev-color, var(--coral)); position: relative; }
  .calendar-event-row::before {
    content: "";
    width: 10px; height: 10px;
    background: var(--ev-color, var(--ink));
    border-radius: 50%;
    flex-shrink: 0;
  }
  .calendar-event-row.exam::before { background: var(--coral); }

  /* ---- Year view: 12 mini month grids ---- */
  .calendar-grid.year-mode {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
  }
  .cal-mini-month {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    padding: 0.7rem 0.7rem 0.85rem;
    display: flex;
    flex-direction: column;
    cursor: default;
  }
  .cal-mini-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 800;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: -0.01em;
    margin-bottom: 0.5rem;
    cursor: pointer;
    align-self: flex-start;
  }
  .cal-mini-title:hover { color: var(--coral); }
  .cal-mini-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    font-size: 0.55rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 0.2rem;
  }
  .cal-mini-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
  }
  .cal-mini-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    position: relative;
    border-radius: 0;
  }
  .cal-mini-cell:hover { background: rgba(42,31,18,0.1); }
  .cal-mini-cell.muted { color: rgba(0,0,0,0.18); }
  .cal-mini-cell.today {
    background: var(--coral);
    color: var(--paper);
    font-weight: 800;
  }
  .cal-mini-cell.has-events::after {
    content: "";
    position: absolute;
    bottom: 1px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px; height: 4px;
    background: var(--dot-color, var(--ink));
    border-radius: 50%;
  }
  .cal-mini-cell.today.has-events::after { background: var(--paper); }

  @media (max-width: 760px) {
    .calendar-grid.year-mode { grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Week view: 7 day columns ---- */
  .calendar-grid.week-mode {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
  }
  .cal-week-col {
    border-right: 1px solid rgba(42,31,18,0.18);
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }
  .cal-week-col:last-child { border-right: none; }
  .cal-week-head {
    background: var(--ink);
    color: var(--paper);
    padding: 0.55rem 0.6rem;
    text-align: center;
    border-bottom: 1.5px solid var(--ink);
  }
  .cal-week-head.today {
    background: var(--coral);
  }
  .cal-week-day {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 800;
    opacity: 0.75;
  }
  .cal-week-date {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.4rem;
    font-weight: 800;
    line-height: 1;
    margin-top: 0.15rem;
  }
  .cal-week-add {
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(42,31,18,0.15);
    padding: 0.4rem;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .cal-week-add:hover { background: rgba(42,31,18,0.08); color: var(--ink); }
  .cal-week-events {
    flex: 1;
    padding: 0.55rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .cal-week-item {
    border-left: 4px solid var(--ev-color, var(--ink));
    background: rgba(255,255,255,0.55);
    padding: 0.4rem 0.55rem;
    font-size: 0.78rem;
    line-height: 1.3;
  }
  .cal-week-item:hover { background: rgba(255,255,255,0.85); }
  .cal-week-item.exam { background: rgba(240,217,154,0.55); border-left-color: var(--coral); cursor: default; }
  .cal-week-time {
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
  }
  .cal-week-title {
    font-weight: 700;
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    margin-top: 0.05rem;
    word-break: break-word;
  }
  .cal-week-notes {
    font-size: 0.7rem;
    font-style: italic;
    color: var(--ink-soft);
    margin-top: 0.15rem;
  }
  .cal-week-empty {
    color: var(--muted);
    font-style: italic;
    text-align: center;
    padding: 1rem 0;
  }

  @media (max-width: 760px) {
    .calendar-grid.week-mode { grid-template-columns: 1fr; }
    .cal-week-col { border-right: none; border-bottom: 1px solid rgba(42,31,18,0.18); min-height: 0; }
    .cal-week-col:last-child { border-bottom: none; }
  }

  /* ---- Modal colour-pick ---- */
  .color-pick {
    display: flex;
    gap: 0.55rem;
    flex-wrap: wrap;
    margin-top: 0.2rem;
  }
  .color-swatch {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--ink);
    background: var(--swatch-color, var(--ink));
    cursor: pointer;
    padding: 0;
    position: relative;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .color-swatch:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  .color-swatch.selected { box-shadow: 3px 3px 0 var(--coral); }
  .color-swatch.selected::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 900;
    font-size: 1rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }

  /* ===== Login gate ===== */
  .login-gate {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(40, 25, 5, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-gate[hidden] { display: none; }
  .login-card {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    padding: 2rem 1.85rem 1.85rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .login-card h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.85rem;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .login-card h1::after {
    content: "";
    display: block;
    width: 60px;
    height: 4px;
    background: var(--coral);
    margin: 0.55rem auto 0;
  }
  .login-card > p {
    margin: 0.85rem 0 1.4rem;
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }
  .login-card form {
    display: flex;
    flex-direction: column;
    gap: 0.95rem;
  }
  .login-card label {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink);
  }
  .login-card input {
    padding: 0.65rem 0.75rem;
    border: 1.5px solid var(--ink);
    background: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    border-radius: 0;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .login-card input:focus {
    outline: none;
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--coral);
  }
  .login-card button[type="submit"] {
    margin-top: 0.4rem;
    padding: 0.75rem 1.4rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    cursor: pointer;
    box-shadow:
      1px 1px 0 var(--edge-soft),
      2px 2px 0 var(--edge),
      3px 3px 0 var(--coral),
      4px 4px 0 var(--coral),
      5px 5px 0 var(--coral);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .login-card button[type="submit"]:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-stack-lift);
  }
  .login-card button[type="submit"]:active {
    transform: translate(2px, 2px);
    box-shadow: var(--shadow-stack-press);
  }
  .login-error {
    color: var(--danger) !important;
    font-style: normal !important;
    font-weight: 800 !important;
    font-size: 0.72rem !important;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin: 1rem 0 0 !important;
    font-family: inherit !important;
  }

  @media (max-width: 640px) {
    .calendar-cell { min-height: 56px; padding: 0.35rem 0.35rem 0.4rem; }
    .calendar-cell .day-num { font-size: 0.74rem; padding: 0.08rem 0.3rem; }
    .calendar-dow { font-size: 0.55rem; letter-spacing: 0.08em; padding: 0.4rem 0.2rem; }
    .calendar-title { font-size: 1.25rem; }
    .cal-nav-btn { padding: 0.5rem 0.8rem; font-size: 0.7rem; }
  }

  /* ===== Flashcards ===== */
  .fc-dirty {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    padding: 0.7rem 1rem;
    margin-bottom: 1.2rem;
    flex-wrap: wrap;
  }
  .fc-dirty[hidden] { display: none; }
  .fc-dirty span {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .fc-dirty .btn-primary { padding: 0.55rem 1rem; font-size: 0.78rem; }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.6rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  .breadcrumb button,
  .breadcrumb span {
    background: transparent;
    border: none;
    padding: 0;
    font: inherit;
    text-transform: inherit;
    letter-spacing: inherit;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .breadcrumb button:hover { color: var(--ink); text-decoration: underline; }
  .breadcrumb .crumb-sep { color: var(--muted); cursor: default; }
  .breadcrumb .crumb-current { color: var(--ink); cursor: default; }

  .fc-toolbar {
    display: flex;
    gap: 0.7rem;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }

  .fc-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }

  .fc-row {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    padding: 1rem 1.15rem;
    box-shadow: var(--shadow-stack);
    display: flex;
    align-items: center;
    gap: 0.85rem;
    transition: transform 0.12s, box-shadow 0.12s;
    cursor: pointer;

  .fc-row:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-stack-lift); }
  .fc-row-main { flex: 1; min-width: 0; }
  .fc-row-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 1.15rem;

    margin: 0 0 0.15rem;

  .fc-row-meta {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .fc-row-actions {
    display: flex;
    gap: 0.4rem;
    flex-shrink: 0;
  }
  .fc-row-actions .icon-btn {
    background: transparent;
    border: none;
    padding: 0.3rem 0.55rem;
    cursor: pointer;
    color: var(--ink-soft);
    font-size: 1.05rem;
    transition: background 0.15s, color 0.15s;
  }
  .fc-row-actions .icon-btn:hover { color: var(--ink); background: rgba(28,31,18,0.07); }
  .fc-row-actions .icon-btn.danger:hover { color: var(--danger); background: rgba(200,84,71,0.12); }

  .fc-empty {
    text-align: center;
    padding: 2.5rem 1rem;

    background: var(--paper);
    border: 1.5px solid var(--ink);
    box-shadow: var(--shadow-stack);
    font-style: italic;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* ----- Card review ----- */
  .fc-review {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    padding: 1rem 0 2rem;
  }
  .fc-position {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .flashcard {
    width: 100%;
    max-width: 520px;
    aspect-ratio: 3 / 2;
    perspective: 1400px;
    cursor: pointer;
    user-select: none;

  .flashcard-inner {

  /* ----- Modal ----- */

<body>
  <div class="login-gate" id="loginGate">
    <div class="login-card">

<script>
(() => {
  const STORAGE_KEY = 'exam-countdown-exams';
  const QUOTES_KEY = 'exam-countdown-quotes';
  const FLASHCARDS_KEY = 'flashcard-sets';
  const FLASHCARDS_DIRTY_KEY = 'flashcard-sets-dirty';
  const CALENDAR_KEY = 'calendar-events';
  const SAVE_PASSWORD = 'Quack';
  const LOGIN_USER = 'Teeg';
  const LOGIN_PASS = 'Ghost';
  const LOGIN_KEY = 'revision-hub-auth';

  /* ===== Login gate ===== */
  const loginGate = document.getElementById('loginGate');
  const loginForm = document.getElementById('loginForm');
  const loginUserInput = document.getElementById('loginUser');
  const loginPassInput = document.getElementById('loginPass');
  const loginError = document.getElementById('loginError');

  function isLoggedIn() {
    return sessionStorage.getItem(LOGIN_KEY) === '1';
  }
  function showLoginGate() {
    loginGate.hidden = false;
    loginError.hidden = true;
    loginUserInput.value = '';
    loginPassInput.value = '';
    setTimeout(() => loginUserInput.focus(), 0);
  }
  function hideLoginGate() {
    loginGate.hidden = true;
  }
  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (loginUserInput.value === LOGIN_USER && loginPassInput.value === LOGIN_PASS) {
      sessionStorage.setItem(LOGIN_KEY, '1');
      mountAndInit();
      hideLoginGate();
      loginError.hidden = true;
      loginUserInput.value = '';
      loginPassInput.value = '';
    } else {
      loginError.hidden = false;
      loginPassInput.value = '';
      loginPassInput.focus();
    }
  });

  let _mounted = false;
  function mountAndInit() {
    if (_mounted) return;
    _mounted = true;
    const tpl = document.getElementById('appShell');
    document.body.appendChild(tpl.content.cloneNode(true));
    initApp();
  }

  function initApp() {
  const JSONBIN_BIN_ID = '69ee444c36566621a8f3a85f';
  const JSONBIN_KEY = '$2a$10$VLqtJYJNOq9KDHJ1u8TaXeUqazTjHr0q8P1HnPfOhl/LUJUoHQXNG';
  const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_BIN_ID;

  const DEFAULT_QUOTES = [
    "Success is the sum of small efforts repeated day in and day out.",
    "The expert in anything was once a beginner.",
    "Don't watch the clock; do what it does. Keep going.",
    "You don't have to be great to start, but you have to start to be great.",
    "Push yourself, because no one else is going to do it for you.",
    "Small steps every day lead to big results.",
    "Study hard, but remember: progress, not perfection.",
    "Believe you can and you're halfway there.",
    "The future depends on what you do today.",
    "Discipline is the bridge between goals and accomplishment.",
    "Every accomplishment starts with the decision to try.",
    "Your only limit is the amount of effort you're willing to put in.",
    "Hard work beats talent when talent doesn't work hard.",
    "The harder you work for something, the greater you'll feel when you achieve it.",
    "Don't let what you cannot do interfere with what you can do.",
    "Opportunities don't happen. You create them.",
    "Dream big. Work hard. Stay focused.",
    "Act as if what you do makes a difference. It does.",
    "Great things never come from comfort zones.",
    "A little progress each day adds up to big results."
  ];

  let QUOTES = DEFAULT_QUOTES.slice();

  const state = {
    exams: [],
    flashcardSets: [],
    flashcardsDirty: false,
    flashcardsNav: { path: [], mode: null, index: 0, flipped: false, order: null, combined: false, cards: null },
    calendarEvents: [],
    calendarView: { year: 0, month: 0, selected: null, mode: 'month' },
    quoteOrder: []
  };

  const form = document.getElementById('addForm');
  const subjectInput = document.getElementById('subjectInput');
  const dateInput = document.getElementById('dateInput');
  const timeInput = document.getElementById('timeInput');
  const durationInput = document.getElementById('durationInput');
  const examsList = document.getElementById('examsList');
  const settingsExamsList = document.getElementById('settingsExamsList');
  const homeView = document.getElementById('homeView');
  const settingsView = document.getElementById('settingsView');
  const menuButton = document.getElementById('menuButton');
  const menuPanel = document.getElementById('menuPanel');
  const pageTagline = document.getElementById('pageTagline');
  const settingsTabs = settingsView.querySelector('.settings-tabs');
  const subviewExams = document.getElementById('subviewExams');
  const subviewQuotes = document.getElementById('subviewQuotes');
  const flashcardsView = document.getElementById('flashcardsView');
  const flashcardsBreadcrumb = document.getElementById('flashcardsBreadcrumb');
  const flashcardsBody = document.getElementById('flashcardsBody');
  const editModal = document.getElementById('editModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalForm = document.getElementById('modalForm');
  const quotesEditor = document.getElementById('quotesEditor');
  const quotesSave = document.getElementById('quotesSave');
  const quotesReset = document.getElementById('quotesReset');

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state.exams = JSON.parse(raw);
    } catch (e) {
      state.exams = [];
    }
    try {
      const rawSets = localStorage.getItem(FLASHCARDS_KEY);
      if (rawSets) {
        const parsed = JSON.parse(rawSets);
        if (Array.isArray(parsed)) state.flashcardSets = parsed;
      }
    } catch (e) {
      state.flashcardSets = [];
    }
    state.flashcardsDirty = localStorage.getItem(FLASHCARDS_DIRTY_KEY) === '1';
    try {
      const rawCal = localStorage.getItem(CALENDAR_KEY);
      if (rawCal) {
        const parsed = JSON.parse(rawCal);
        if (Array.isArray(parsed)) state.calendarEvents = parsed;
      }
    } catch (e) {
      state.calendarEvents = [];
    }
    try {
      const rawQuotes = localStorage.getItem(QUOTES_KEY);
      if (rawQuotes) {
        const parsed = JSON.parse(rawQuotes);
        if (Array.isArray(parsed) && parsed.length > 0) {
          QUOTES = parsed.map(String);
        }
      }
    } catch (e) { /* keep defaults */ }
    state.quoteOrder = shuffle([...Array(QUOTES.length).keys()]);
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.exams));
    localStorage.setItem(FLASHCARDS_KEY, JSON.stringify(state.flashcardSets));
    localStorage.setItem(CALENDAR_KEY, JSON.stringify(state.calendarEvents));
  }

  /* ===== Remote sync (JSONBin) ===== */
  const syncStatusEl = document.getElementById('syncStatus');
  let pushInFlight = false;
  let pendingChanges = false;

  function setSyncStatus(s, detail) {
    if (!syncStatusEl) return;
    const labels = {
      idle: '',
      syncing: '⟳ Syncing…',
      synced: '✓ Synced',
      offline: '⚠ Offline' + (detail ? ' — ' + detail : ' — using local data'),
      error: '⚠ Sync failed' + (detail ? ' — ' + detail : ' — saved locally')
    };
    syncStatusEl.dataset.state = s;
    syncStatusEl.textContent = labels[s] || '';
  }

  async function jsonbinRequest(url, init) {
    const res = await fetch(url, init);
    if (!res.ok) {
      let body = '';
      try { body = (await res.text()).slice(0, 160); } catch (e) { /* ignore */ }
      const err = new Error('HTTP ' + res.status + (body ? ' — ' + body : ''));
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  async function fetchRemote() {
    setSyncStatus('syncing');
    try {
      const data = await jsonbinRequest(JSONBIN_URL + '/latest', {
        headers: { 'X-Access-Key': JSONBIN_KEY }
      });
      const record = (data && data.record) ? data.record : data;
      let changed = false;
      if (record && Array.isArray(record.exams)) {
        state.exams = record.exams;
        changed = true;
      }
      if (record && Array.isArray(record.flashcardSets) && !state.flashcardsDirty) {
        state.flashcardSets = record.flashcardSets;
        changed = true;
      }
      if (record && Array.isArray(record.calendarEvents)) {
        state.calendarEvents = record.calendarEvents;
        changed = true;
      }
      if (changed) {
        save();
        render();
        renderFlashcards();
        renderCalendar();
      }
      setSyncStatus('synced');
    } catch (e) {
      console.error('JSONBin fetch failed:', e);
      setSyncStatus('offline', e.message);
    }
  }

  async function pushRemote() {
    if (pushInFlight) {
      pendingChanges = true;
      return;
    }
    pushInFlight = true;
    setSyncStatus('syncing');
    try {
      await jsonbinRequest(JSONBIN_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Access-Key': JSONBIN_KEY
        },
        body: JSON.stringify({
          exams: state.exams,
          flashcardSets: state.flashcardSets,
          calendarEvents: state.calendarEvents
        })
      });
      setSyncStatus('synced');
    } catch (e) {
      console.error('JSONBin push failed:', e);
      setSyncStatus('error', e.message);
    } finally {
      pushInFlight = false;
      if (pendingChanges) {
        pendingChanges = false;
        pushRemote();
      }
    }
  }

  function saveQuotesToStorage() {
    localStorage.setItem(QUOTES_KEY, JSON.stringify(QUOTES));
  }

  function quoteForIndex(i) {
    return QUOTES[state.quoteOrder[i % QUOTES.length]];
  }

  function formatDate(iso) {
    const d = new Date(iso);
    const hasTime = iso.includes('T') && !iso.endsWith('T00:00:00');
    const dateOpts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
    let out = d.toLocaleDateString(undefined, dateOpts);
    if (hasTime) {
      out += ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }
    return out;
  }

  function diffParts(targetMs, nowMs) {
    let diff = Math.max(0, targetMs - nowMs);
    const days = Math.floor(diff / 86400000); diff -= days * 86400000;
    const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
    const mins = Math.floor(diff / 60000); diff -= mins * 60000;
    const secs = Math.floor(diff / 1000);
    return { days, hours, mins, secs };
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDuration(mins) {
    if (!mins || mins <= 0) return '';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h && m) return `${h}h ${m}m`;
    if (h) return `${h}h`;
    return `${m}m`;
  }

  function formatFinishTime(startIso, durationMins) {
    if (!durationMins || durationMins <= 0) return '';
    const start = new Date(startIso);
    const finish = new Date(start.getTime() + durationMins * 60000);
    const sameDay = start.toDateString() === finish.toDateString();
    const timeStr = finish.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return timeStr;
    return finish.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + timeStr;
  }

  function parseDurationInput(value) {
    if (!value) return 0;
    const [h, m] = value.split(':').map(n => parseInt(n, 10) || 0);
    return h * 60 + m;
  }

  function durationToTimeInput(mins) {
    if (!mins || mins <= 0) return '';
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  function promptEditExam(exam) {
    const date = (exam.datetime || '').slice(0, 10);
    const time = (exam.datetime || '').slice(11, 16);
    openModal({
      title: 'Edit exam',
      fields: [
        { name: 'subject', label: 'Subject', value: exam.subject, required: true, placeholder: 'e.g. Mathematics' },
        { name: 'date', label: 'Date', value: date, type: 'date', required: true },
        { name: 'time', label: 'Time (optional)', value: time, type: 'time' },
        { name: 'duration', label: 'Length (optional)', value: durationToTimeInput(exam.durationMins), type: 'time' }
      ],
      onSave: (vals) => {
        if (!vals.subject) { window.alert('Subject is required.'); return false; }
        if (!vals.date)    { window.alert('Date is required.');    return false; }
        const pwd = window.prompt('Enter password to save changes:');
        if (pwd === null) return false;
        if (pwd !== SAVE_PASSWORD) {
          window.alert('Incorrect password. Changes not saved.');
          return false;
        }
        exam.subject = vals.subject.trim();
        exam.datetime = vals.time ? `${vals.date}T${vals.time}` : `${vals.date}T09:00`;
        exam.durationMins = parseDurationInput(vals.duration);
        save();
        pushRemote();
        render();
      }
    });
  }

  function addExam(subject, dateStr, timeStr, durationMins) {
    const iso = timeStr ? `${dateStr}T${timeStr}` : `${dateStr}T09:00`;
    const exam = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      subject: subject.trim(),
      datetime: iso,
      durationMins: durationMins || 0
    };
    state.exams.push(exam);
    save();
    pushRemote();
    render();
  }

  function deleteExam(id) {
    state.exams = state.exams.filter(e => e.id !== id);
    save();
    pushRemote();
    render();
  }

  function render() {
    const now = Date.now();
    const sorted = [...state.exams].sort(
      (a, b) => new Date(a.datetime) - new Date(b.datetime)
    );

    if (sorted.length === 0) {
      examsList.innerHTML = '<div class="empty">No exams yet. Open the menu and go to Settings to add your first one.</div>';
    } else {
      examsList.innerHTML = '';
      sorted.forEach((exam, i) => {
        const target = new Date(exam.datetime).getTime();
        const isDone = target <= now;
        const msLeft = target - now;
        const isUrgent = !isDone && msLeft <= 7 * 86400000;

        const card = document.createElement('article');
        card.className = 'exam-card' + (isDone ? ' done' : (isUrgent ? ' urgent' : ''));
        card.dataset.target = target;

        const { days, hours, mins, secs } = diffParts(target, now);

        const durationStr = formatDuration(exam.durationMins);
        const finishStr = formatFinishTime(exam.datetime, exam.durationMins);
        const durationLine = durationStr

  function tick() {
    const now = Date.now();
    const cards = examsList.querySelectorAll('.exam-card');
    let needsRerender = false;

    cards.forEach(card => {
      const target = Number(card.dataset.target);
      const wasDone = card.classList.contains('done');
      const isDone = target <= now;

      if (isDone !== wasDone) {
        needsRerender = true;
        return;
      }
      if (isDone) return;

      const msLeft = target - now;
      const shouldBeUrgent = msLeft <= 7 * 86400000;
      if (shouldBeUrgent !== card.classList.contains('urgent')) {
        needsRerender = true;
        return;
      }

      const { days, hours, mins, secs } = diffParts(target, now);
      const values = card.querySelectorAll('.time-value');
      values[0].textContent = days;
      values[1].textContent = pad(hours);
      values[2].textContent = pad(mins);
      values[3].textContent = pad(secs);
    });

    if (needsRerender) render();
  }

  /* ===================================================================
   * Flashcards
   * =================================================================== */

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* Resolve a node by its path. path=[] returns null (means root container). */
  function resolvePath(path) {
    if (!path || !path.length) return null;
    let node = state.flashcardSets.find(s => s.id === path[0]);
    for (let i = 1; i < path.length; i++) {
      if (!node || !Array.isArray(node.subsets)) return null;
      node = node.subsets.find(s => s.id === path[i]);
    }
    return node || null;
  }
  /* Container the path's leaf node sits inside (used for delete / replacement). */
  function resolveParentCollection(path) {
    if (!path || !path.length) return null;
    if (path.length === 1) return state.flashcardSets;
    const parent = resolvePath(path.slice(0, -1));
    if (!parent) return null;
    if (!Array.isArray(parent.subsets)) parent.subsets = [];
    return parent.subsets;
  }
  /* The children collection for a node at path (root if path is empty). */
  function resolveChildrenCollection(path) {
    if (!path || !path.length) return state.flashcardSets;
    const node = resolvePath(path);
    if (!node) return null;
    if (!Array.isArray(node.subsets)) node.subsets = [];
    return node.subsets;
  }

  function nodeHasCards(n) { return !!(n && Array.isArray(n.cards) && n.cards.length); }
  function nodeHasSubsets(n) { return !!(n && Array.isArray(n.subsets) && n.subsets.length); }
  function totalCardCount(n) {
    if (!n) return 0;
    let total = (n.cards || []).length;
    if (Array.isArray(n.subsets)) n.subsets.forEach(c => { total += totalCardCount(c); });
    return total;
  }

  /* ----- Edit modal (reusable form) ----- */
  let modalOnSave = null;

  function openModal({ title, fields, onSave }) {
    modalTitle.textContent = title;
    modalForm.innerHTML = '';
    fields.forEach(f => {
      const label = document.createElement('label');
      label.textContent = f.label;

      if (f.type === 'color-pick') {
        const wrap = document.createElement('div');
        wrap.className = 'color-pick';
        const hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = f.name;
        hidden.value = f.value || (f.options && f.options[0] && f.options[0].id) || '';
        wrap.appendChild(hidden);
        (f.options || []).forEach(opt => {
          const sw = document.createElement('button');
          sw.type = 'button';
          sw.className = 'color-swatch' + (opt.id === hidden.value ? ' selected' : '');
          sw.style.setProperty('--swatch-color', opt.css);
          sw.dataset.color = opt.id;
          sw.title = opt.name;
          sw.setAttribute('aria-label', opt.name);
          sw.addEventListener('click', () => {
            hidden.value = opt.id;
            wrap.querySelectorAll('.color-swatch').forEach(s => {
              s.classList.toggle('selected', s.dataset.color === opt.id);
            });
          });
          wrap.appendChild(sw);
        });
        label.appendChild(wrap);
      } else {
        const input = f.multiline
          ? document.createElement('textarea')
          : document.createElement('input');
        if (!f.multiline) input.type = f.type || 'text';
        input.name = f.name;
        input.value = f.value || '';
        if (f.placeholder) input.placeholder = f.placeholder;
        if (f.required) input.required = true;
        label.appendChild(input);
      }
      modalForm.appendChild(label);
    });
    modalOnSave = onSave;
    editModal.hidden = false;
    const first = modalForm.querySelector('input:not([type="hidden"]), textarea');
    if (first) first.focus();
  }

  function closeModal() {
    editModal.hidden = true;
    modalForm.innerHTML = '';
    modalOnSave = null;
  }

  function readModalValues() {
    const values = {};
    modalForm.querySelectorAll('input, textarea').forEach(el => {
      values[el.name] = el.value.trim();
    });
    return values;
  }

  function modalSave() {
    if (!modalOnSave) return;
    const values = readModalValues();
    const result = modalOnSave(values);
    if (result === false) return; // validation failed
    closeModal();
  }

  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeModal();
    const act = e.target.closest('[data-modal-act]');
    if (!act) return;
    if (act.dataset.modalAct === 'cancel') closeModal();
    else if (act.dataset.modalAct === 'save') modalSave();
