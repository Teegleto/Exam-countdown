  modalForm.addEventListener('submit', (e) => { e.preventDefault(); modalSave(); });

  /* ----- Dirty tracking + commit ----- */
  function markDirty() {
    state.flashcardsDirty = true;
    localStorage.setItem(FLASHCARDS_DIRTY_KEY, '1');
    updateDirtyIndicator();
  }
  function clearDirty() {
    state.flashcardsDirty = false;
    localStorage.removeItem(FLASHCARDS_DIRTY_KEY);
    updateDirtyIndicator();
  }
  async function commitFlashcards({ silentIfClean = true } = {}) {
    if (!state.flashcardsDirty) {
      if (!silentIfClean) window.alert('Nothing to save.');
      return;
    }
    const pwd = window.prompt('Enter password to save changes:');
    if (pwd === null) return;
    if (pwd !== SAVE_PASSWORD) {
      window.alert('Incorrect password. Changes saved locally only.');
      return;
    }
    await pushRemote();
    clearDirty();
  }
  function updateDirtyIndicator() {
    const banner = document.getElementById('flashcardsDirtyBanner');
    if (banner) banner.hidden = !state.flashcardsDirty;
  }

  /* ----- CRUD (path-based, recursive nesting) ----- */
  function addNode(parentPath, name) {
    const coll = resolveChildrenCollection(parentPath);
    if (!coll) return;
    coll.push({ id: newId(), name: name.trim(), subsets: [], cards: [] });
    save(); markDirty();
  }
  function updateNode(path, name) {
    const n = resolvePath(path); if (!n) return;
    n.name = name.trim();
    save(); markDirty();
  }
  function deleteNode(path) {
    const parent = resolveParentCollection(path);
    if (!parent || !path.length) return;
    const id = path[path.length - 1];
    const idx = parent.findIndex(n => n.id === id);
    if (idx === -1) return;
    parent.splice(idx, 1);
    save(); markDirty();
  }
  function addCard(containerPath, front, back) {
    const node = resolvePath(containerPath); if (!node) return;
    if (!Array.isArray(node.cards)) node.cards = [];
    node.cards.push({ id: newId(), front: front.trim(), back: back.trim() });
    save(); markDirty();
  }
  function updateCard(containerPath, cardId, front, back) {
    const node = resolvePath(containerPath); if (!node || !Array.isArray(node.cards)) return;
    const c = node.cards.find(x => x.id === cardId);
    if (!c) return;
    c.front = front.trim();
    c.back = back.trim();
    save(); markDirty();
  }
  function deleteCard(containerPath, cardId) {
    const node = resolvePath(containerPath); if (!node || !Array.isArray(node.cards)) return;
    node.cards = node.cards.filter(c => c.id !== cardId);
    save(); markDirty();
  }

  /* ----- Navigation ----- */
  function flashcardsGoto(nav) {
    state.flashcardsNav = Object.assign(
      { path: [], mode: null, index: 0, flipped: false, order: null, combined: false, cards: null },
      nav || {}
    );
    renderFlashcards();
  }

  function buildBreadcrumb() {
    flashcardsBreadcrumb.innerHTML = '';
    const nav = state.flashcardsNav;
    const root = document.createElement('button');
    root.type = 'button';
    root.textContent = 'Flashcards';
    root.addEventListener('click', () => flashcardsGoto({}));
    flashcardsBreadcrumb.appendChild(root);

    for (let i = 0; i < nav.path.length; i++) {
      const subPath = nav.path.slice(0, i + 1);
      const node = resolvePath(subPath);
      const isLast = i === nav.path.length - 1;
      const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '›';
      flashcardsBreadcrumb.appendChild(sep);
      const clickable = !isLast || nav.mode || nav.combined;
      const el = document.createElement(clickable ? 'button' : 'span');
      el.textContent = node ? node.name : '…';
      if (clickable) {
        el.type = 'button';
        el.addEventListener('click', () => flashcardsGoto({ path: subPath }));
      } else {
        el.className = 'crumb-current';
      }
      flashcardsBreadcrumb.appendChild(el);
    }
    if (nav.combined) {
      const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '›';
      flashcardsBreadcrumb.appendChild(sep);
      const allEl = document.createElement('span'); allEl.className = 'crumb-current'; allEl.textContent = 'All cards';
      flashcardsBreadcrumb.appendChild(allEl);
    }
    if (nav.mode === 'review') {
      const sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '›';
      flashcardsBreadcrumb.appendChild(sep);
      const cur = document.createElement('span'); cur.className = 'crumb-current'; cur.textContent = 'Review';
      flashcardsBreadcrumb.appendChild(cur);
    }
  }

  /* ----- Render ----- */
  function renderFlashcards() {
    if (flashcardsView.hidden) return;
    buildBreadcrumb();
    const nav = state.flashcardsNav;
    if (nav.mode === 'review') return renderReview();
    if (!nav.path.length) return renderSetsList();
    return renderNodeDetail(nav.path);
  }

  function buildNodeRow(node, nodePath) {
    const row = document.createElement('div');
    row.className = 'fc-row';
    const hasSubs = nodeHasSubsets(node);
    const hasCards = nodeHasCards(node);
    const total = totalCardCount(node);
    const reviewable = total > 0;

    row.innerHTML = `
      <div class="fc-row-main">
        <p class="fc-row-title"></p>
        <div class="fc-row-meta"></div>
      </div>
      <div class="fc-row-actions">
        ${reviewable ? '<button class="icon-btn" data-act="review" title="Review">▸</button>' : ''}
        <button class="icon-btn" data-act="edit" title="Rename">✎</button>
        <button class="icon-btn danger" data-act="delete" title="Delete">×</button>
      </div>`;
    row.querySelector('.fc-row-title').textContent = node.name;
    const parts = [];
    if (hasSubs) parts.push(`${node.subsets.length} subset${node.subsets.length === 1 ? '' : 's'}`);
    if (hasCards) parts.push(`${node.cards.length} card${node.cards.length === 1 ? '' : 's'}`);
    if (hasSubs && total) parts.push(`${total} total`);
    if (!parts.length) parts.push('empty');
    row.querySelector('.fc-row-meta').textContent = parts.join(' · ');

    row.addEventListener('click', (e) => {
      if (e.target.closest('[data-act]')) return;
      flashcardsGoto({ path: nodePath });
    });
    const reviewBtn = row.querySelector('[data-act="review"]');
    if (reviewBtn) {
      reviewBtn.addEventListener('click', () => {
        if (hasSubs) startReviewCombined(nodePath);
        else startReview(nodePath);
      });
    }
    row.querySelector('[data-act="edit"]').addEventListener('click', () => promptNode(nodePath.slice(0, -1), node, nodePath));
    row.querySelector('[data-act="delete"]').addEventListener('click', () => {
      if (!window.confirm(`Delete "${node.name}" and everything in it?`)) return;
      deleteNode(nodePath); renderFlashcards();
    });
    return row;
  }

  function renderSetsList() {
    flashcardsBody.innerHTML = '';
    const toolbar = document.createElement('div');
    toolbar.className = 'fc-toolbar';
    const addBtn = document.createElement('button');
    addBtn.className = 'btn-primary';
    addBtn.textContent = '+ New set';
    addBtn.addEventListener('click', () => promptNode([], null));
    toolbar.appendChild(addBtn);
    flashcardsBody.appendChild(toolbar);

    if (!state.flashcardSets.length) {
      const empty = document.createElement('div');
      empty.className = 'fc-empty';
      empty.textContent = 'No flashcard sets yet. Create your first one above.';
      flashcardsBody.appendChild(empty);
      return;
    }

    const list = document.createElement('div');
    list.className = 'fc-list';
    state.flashcardSets.forEach(s => list.appendChild(buildNodeRow(s, [s.id])));
    flashcardsBody.appendChild(list);
  }

  function renderNodeDetail(path) {
    const node = resolvePath(path);
    flashcardsBody.innerHTML = '';
    if (!node) {
      flashcardsGoto({});
      return;
    }
    const toolbar = document.createElement('div');
    toolbar.className = 'fc-toolbar';

    const hasSubs = nodeHasSubsets(node);
    const hasCards = nodeHasCards(node);

    if (hasSubs || (!hasSubs && !hasCards)) {
      const addSubBtn = document.createElement('button');
      addSubBtn.className = 'btn-primary';
      addSubBtn.textContent = '+ New subset';
      addSubBtn.addEventListener('click', () => promptNode(path, null));
      toolbar.appendChild(addSubBtn);
    }
    if (hasCards || (!hasSubs && !hasCards)) {
      const addCardBtn = document.createElement('button');
      addCardBtn.className = 'btn-primary';
      addCardBtn.textContent = '+ New card';
      addCardBtn.addEventListener('click', () => promptCard(path, null));
      toolbar.appendChild(addCardBtn);
    }
    if (hasCards) {
      const reviewBtn = document.createElement('button');
      reviewBtn.className = 'btn-primary';
      reviewBtn.textContent = 'Review ▸';
      reviewBtn.addEventListener('click', () => startReview(path));
      toolbar.appendChild(reviewBtn);
    }
    if (hasSubs && totalCardCount(node) > 0) {
      const reviewAllBtn = document.createElement('button');
      reviewAllBtn.className = 'btn-primary';
      reviewAllBtn.textContent = 'Review all ▸';
      reviewAllBtn.addEventListener('click', () => startReviewCombined(path));
      toolbar.appendChild(reviewAllBtn);
    }
    flashcardsBody.appendChild(toolbar);

    if (hasSubs) {
      const list = document.createElement('div');
      list.className = 'fc-list';
      node.subsets.forEach(child => list.appendChild(buildNodeRow(child, [...path, child.id])));
      flashcardsBody.appendChild(list);
    } else if (hasCards) {
      renderCardListInto(flashcardsBody, path, node.cards);
    } else {
      const empty = document.createElement('div');
      empty.className = 'fc-empty';
      empty.textContent = 'Empty. Add a subset to organise into groups, or add a card directly.';
      flashcardsBody.appendChild(empty);
    }
  }

  function renderCardListInto(container, containerPath, cards) {
    if (!cards.length) {
      const empty = document.createElement('div');
      empty.className = 'fc-empty';
      empty.textContent = 'No cards yet. Add your first one above.';
      container.appendChild(empty);
      return;
    }
    const list = document.createElement('div');
    list.className = 'fc-list';
    cards.forEach(c => {
      const row = document.createElement('div');
      row.className = 'fc-row';
      row.innerHTML = `
        <div class="fc-row-main">
          <p class="fc-row-title"></p>
          <div class="fc-row-meta"></div>
        </div>
        <div class="fc-row-actions">
          <button class="icon-btn" data-act="edit" title="Edit">✎</button>
          <button class="icon-btn danger" data-act="delete" title="Delete">×</button>
        </div>`;
      row.querySelector('.fc-row-title').textContent = c.front;
      row.querySelector('.fc-row-meta').textContent = (c.back || '').slice(0, 80);
      row.style.cursor = 'default';
      row.querySelector('[data-act="edit"]').addEventListener('click', () => promptCard(containerPath, c));
      row.querySelector('[data-act="delete"]').addEventListener('click', () => {
        if (!window.confirm(`Delete card "${c.front.slice(0, 40)}"?`)) return;
        deleteCard(containerPath, c.id); renderFlashcards();
      });
      list.appendChild(row);
    });
    container.appendChild(list);
  }

  function startReview(path) {
    const node = resolvePath(path);
    const cards = (node && node.cards) ? node.cards : [];
    if (!cards.length) { window.alert('No cards to review.'); return; }
    const order = cards.map((_, i) => i);
    flashcardsGoto({ path, mode: 'review', index: 0, flipped: false, order });
  }

  function startReviewCombined(path) {
    const node = resolvePath(path);
    if (!node) return;
    const collected = [];
    (function walk(n, currentPath) {
      if (Array.isArray(n.cards) && n.cards.length) {
        n.cards.forEach(c => collected.push({ card: c, containerPath: currentPath.slice() }));
      }
      if (Array.isArray(n.subsets)) {
        n.subsets.forEach(child => walk(child, [...currentPath, child.id]));
      }
    })(node, path.slice());
    if (!collected.length) { window.alert('No cards in this group yet.'); return; }
    const order = collected.map((_, i) => i);
    flashcardsGoto({
      path, combined: true, mode: 'review',
      index: 0, flipped: false, order, cards: collected
    });
  }

  function reviewCards() {
    const nav = state.flashcardsNav;
    if (nav.combined && Array.isArray(nav.cards)) {
      return nav.cards.map(x => x.card);
    }
    const node = resolvePath(nav.path);
    return (node && node.cards) ? node.cards : [];
  }

  function renderReview() {
    const nav = state.flashcardsNav;
    const cards = reviewCards();
    if (!cards.length || !nav.order || !nav.order.length) {
      flashcardsGoto({ path: nav.path });
      return;
    }
    const safeIdx = Math.min(nav.index, nav.order.length - 1);
    const card = cards[nav.order[safeIdx]];
    if (!card) { flashcardsGoto({ path: nav.path }); return; }

    flashcardsBody.innerHTML = `
      <div class="fc-review">
        <div class="fc-position"></div>
        <div class="flashcard" id="reviewCard" data-flipped="${nav.flipped ? 'true' : 'false'}" tabindex="0">
          <div class="flashcard-inner">
            <div class="flashcard-face front">
              <span class="face-label">Front</span>
              <div class="face-text"></div>
            </div>
            <div class="flashcard-face back">
              <span class="face-label">Back</span>
              <div class="face-text"></div>
            </div>
          </div>
        </div>
        <div class="fc-controls">
          <button data-act="prev">‹ Prev</button>
          <button data-act="flip">Flip</button>
          <button data-act="next">Next ›</button>
          <button data-act="shuffle">Shuffle</button>
          <button data-act="edit">Edit</button>
          <button data-act="delete">Delete</button>
        </div>
      </div>`;

    flashcardsBody.querySelector('.fc-position').textContent = `Card ${safeIdx + 1} of ${nav.order.length}`;
    flashcardsBody.querySelector('.flashcard-face.front .face-text').textContent = card.front;
    flashcardsBody.querySelector('.flashcard-face.back .face-text').textContent = card.back || '(blank)';

    const containerPath = nav.combined && nav.cards
      ? nav.cards[nav.order[safeIdx]].containerPath
      : nav.path;

    const cardEl = flashcardsBody.querySelector('#reviewCard');
    cardEl.addEventListener('click', flipReview);

    flashcardsBody.querySelector('[data-act="prev"]').addEventListener('click', prevReview);
    flashcardsBody.querySelector('[data-act="next"]').addEventListener('click', nextReview);
    flashcardsBody.querySelector('[data-act="flip"]').addEventListener('click', flipReview);
    flashcardsBody.querySelector('[data-act="shuffle"]').addEventListener('click', shuffleReview);
    flashcardsBody.querySelector('[data-act="edit"]').addEventListener('click', () => {
      promptCard(containerPath, card);
    });
    flashcardsBody.querySelector('[data-act="delete"]').addEventListener('click', () => {
      if (!window.confirm(`Delete card "${card.front.slice(0, 40)}"?`)) return;
      deleteCard(containerPath, card.id);

      if (nav.combined) {
        const removeAt = nav.order[safeIdx];
        nav.cards.splice(removeAt, 1);
        if (!nav.cards.length) {
          flashcardsGoto({ path: nav.path });
          return;
        }
        const newOrder = nav.cards.map((_, i) => i);
        const newIdx = Math.min(nav.index, newOrder.length - 1);
        flashcardsGoto({
          path: nav.path, combined: true, mode: 'review',
          index: newIdx, flipped: false, order: newOrder, cards: nav.cards
        });
        return;
      }

      const remaining = reviewCards();
      if (!remaining.length) {
        flashcardsGoto({ path: nav.path });
        return;
      }
      const newOrder = remaining.map((_, i) => i);
      const newIdx = Math.min(nav.index, newOrder.length - 1);
      flashcardsGoto({ path: nav.path, mode: 'review', index: newIdx, flipped: false, order: newOrder });
    });

    cardEl.focus();
  }

  function flipReview() {
    state.flashcardsNav.flipped = !state.flashcardsNav.flipped;
    const cardEl = flashcardsBody.querySelector('#reviewCard');
    if (cardEl) cardEl.dataset.flipped = state.flashcardsNav.flipped ? 'true' : 'false';
  }
  function prevReview() {
    const nav = state.flashcardsNav;
    nav.index = (nav.index - 1 + nav.order.length) % nav.order.length;
    nav.flipped = false;
    renderReview();
  }
  function nextReview() {
    const nav = state.flashcardsNav;
    nav.index = (nav.index + 1) % nav.order.length;
    nav.flipped = false;
    renderReview();
  }
  function shuffleReview() {
    const nav = state.flashcardsNav;
    nav.order = shuffle(nav.order.slice());
    nav.index = 0;
    nav.flipped = false;
    renderReview();
  }

  /* Keyboard shortcuts active only while in review */
  document.addEventListener('keydown', (e) => {
    if (state.flashcardsNav.mode !== 'review') return;
    if (!editModal.hidden) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevReview(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nextReview(); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipReview(); }
  });

  /* ----- Edit prompts ----- */
  function promptNode(parentPath, existing, nodePath) {
    const isRoot = parentPath.length === 0;
    const verb = existing ? 'Rename' : 'New';
    const kind = isRoot ? 'set' : 'subset';
    openModal({
      title: `${verb} ${kind}`,
      fields: [{
        name: 'name', label: 'Name',
        value: existing ? existing.name : '',
        required: true,
        placeholder: isRoot ? 'e.g. Biology' : 'e.g. Cells'
      }],
      onSave: ({ name }) => {
        if (!name) { window.alert('Name is required.'); return false; }
        if (existing) updateNode(nodePath, name);
        else addNode(parentPath, name);
        renderFlashcards();
      }
    });
  }
  function promptCard(containerPath, existing) {
    openModal({
      title: existing ? 'Edit card' : 'New card',
      fields: [
        { name: 'front', label: 'Front', value: existing ? existing.front : '', required: true, multiline: true, placeholder: 'Question or term' },
        { name: 'back',  label: 'Back',  value: existing ? existing.back  : '', multiline: true, placeholder: 'Answer or definition' }
      ],
      onSave: ({ front, back }) => {
        if (!front) { window.alert('Front is required.'); return false; }
        if (existing) updateCard(containerPath, existing.id, front, back);
        else addCard(containerPath, front, back);
        renderFlashcards();
      }
    });
  }

  const saveNowBtn = document.getElementById('flashcardsSaveNow');
  if (saveNowBtn) {
    saveNowBtn.addEventListener('click', () => commitFlashcards({ silentIfClean: false }));
  }

  /* ===================================================================
   * Calendar
   * =================================================================== */
  const calendarView_el = document.getElementById('calendarView');
  const calendarTitle = document.getElementById('calendarTitle');
  const calendarGrid = document.getElementById('calendarGrid');
  const calendarDayPanel = document.getElementById('calendarDayPanel');
  const calPrevBtn = document.getElementById('calPrev');
  const calNextBtn = document.getElementById('calNext');
  const calTodayBtn = document.getElementById('calToday');

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const CALENDAR_COLORS = [
    { id: 'ink',     name: 'Ink',     css: '#2a1f12' },
    { id: 'coral',   name: 'Coral',   css: '#c95c40' },
    { id: 'teal',    name: 'Teal',    css: '#4d8a87' },
    { id: 'mustard', name: 'Mustard', css: '#c89a3f' },
    { id: 'plum',    name: 'Plum',    css: '#704c5e' }
  ];
  function eventColorCss(id) {
    const c = CALENDAR_COLORS.find(x => x.id === id);
    return c ? c.css : '#2a1f12';
  }
  function eventColorFor(ev) {
    if (ev.isExam) return '#c95c40';
    return eventColorCss(ev.color || 'ink');
  }

  function isoForDate(d) {
    return d.getFullYear() + '-'
      + String(d.getMonth() + 1).padStart(2, '0') + '-'
      + String(d.getDate()).padStart(2, '0');
  }
  function todayIso() { return isoForDate(new Date()); }

  function getEventsForDate(iso) {
    const userEvents = state.calendarEvents
      .filter(e => e.date === iso)
      .map(e => ({ ...e, isExam: false }));
    const examEvents = state.exams
      .filter(e => typeof e.datetime === 'string' && e.datetime.slice(0, 10) === iso)
      .map(e => ({
        id: 'exam:' + e.id,
        title: e.subject,
        date: iso,
        time: e.datetime.slice(11, 16),
        notes: e.durationMins ? formatDuration(e.durationMins) + ' exam' : 'Exam',
        isExam: true
      }));
    return [...userEvents, ...examEvents].sort((a, b) => {
      const ta = a.time || '';
      const tb = b.time || '';
      if (ta && tb) return ta.localeCompare(tb);
      if (ta) return -1;
      if (tb) return 1;
      return 0;
    });
  }

  function buildMonthCells(year, month) {
    const first = new Date(year, month, 1);
    const startDow = (first.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];

    for (let i = startDow - 1; i >= 0; i--) {
      const d = new Date(year, month, -i);
      cells.push({ date: isoForDate(d), day: d.getDate(), inMonth: false });
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(year, month, day);
      cells.push({ date: isoForDate(d), day, inMonth: true });
    }
    while (cells.length < 42) {
      const d = new Date(year, month + 1, cells.length - startDow - daysInMonth + 1);
      cells.push({ date: isoForDate(d), day: d.getDate(), inMonth: false });
    }
    return cells;
  }

  function renderCalendar() {
    if (calendarView_el.hidden) return;
    if (!state.calendarView.selected) state.calendarView.selected = todayIso();

    document.querySelectorAll('.cal-mode-switch button[data-mode]').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === state.calendarView.mode);
    });

    const mode = state.calendarView.mode;
    if (mode === 'year') return renderYearView();
    if (mode === 'week') return renderWeekView();
    return renderMonthView();
  }

  function renderMonthView() {
    const { year, month } = state.calendarView;
    calendarTitle.textContent = `${MONTH_NAMES[month]} ${year}`;

    calendarGrid.className = 'calendar-grid month-mode';
    calendarGrid.innerHTML = '';

    DOW_NAMES.forEach(name => {
      const dow = document.createElement('div');
      dow.className = 'calendar-dow';
      dow.textContent = name;
      calendarGrid.appendChild(dow);
    });

    const today = todayIso();
    const cells = buildMonthCells(year, month);
    cells.forEach(cell => {
      const events = getEventsForDate(cell.date);
      const div = document.createElement('div');
      div.className = 'calendar-cell'
        + (cell.inMonth ? '' : ' muted')
        + (cell.date === today ? ' today' : '')
        + (cell.date === state.calendarView.selected ? ' selected' : '');

      const header = document.createElement('div');
      header.className = 'cal-cell-header';
      const dayNum = document.createElement('span');
      dayNum.className = 'day-num';
      dayNum.textContent = cell.day;
      header.appendChild(dayNum);
      div.appendChild(header);

      if (events.length) {
        const list = document.createElement('div');
        list.className = 'cal-cell-events';
        events.forEach(ev => {
          const item = document.createElement('div');
          item.className = 'cal-cell-event' + (ev.isExam ? ' exam' : '');
          item.style.setProperty('--ev-color', eventColorFor(ev));
          const dot = document.createElement('span');
          dot.className = 'event-dot';
          item.appendChild(dot);
          const t = document.createElement('span');
          t.className = 'cal-cell-event-title';
          t.textContent = (ev.time ? ev.time + ' ' : '') + ev.title;
          item.appendChild(t);
          list.appendChild(item);
        });
        div.appendChild(list);
      }

      div.addEventListener('click', () => {
        state.calendarView.selected = cell.date;
        if (!cell.inMonth) {
          const d = new Date(cell.date + 'T00:00:00');
          state.calendarView.year = d.getFullYear();
          state.calendarView.month = d.getMonth();
        }
        renderCalendar();
      });
      calendarGrid.appendChild(div);
    });

    calendarDayPanel.hidden = false;
    renderDayPanel();
  }

  function renderYearView() {
    const { year } = state.calendarView;
    calendarTitle.textContent = String(year);

    calendarGrid.className = 'calendar-grid year-mode';
    calendarGrid.innerHTML = '';

    const today = todayIso();

    for (let m = 0; m < 12; m++) {
      const mini = document.createElement('div');
      mini.className = 'cal-mini-month';

      const title = document.createElement('div');
      title.className = 'cal-mini-title';
      title.textContent = MONTH_NAMES[m];
      title.addEventListener('click', () => {
        state.calendarView.month = m;
        state.calendarView.mode = 'month';
        renderCalendar();
      });
      mini.appendChild(title);

      const dow = document.createElement('div');
      dow.className = 'cal-mini-dow';
      DOW_NAMES.forEach(n => {
        const d = document.createElement('span');
        d.textContent = n.charAt(0);
        dow.appendChild(d);
      });
      mini.appendChild(dow);

      const grid = document.createElement('div');
      grid.className = 'cal-mini-grid';
      const cells = buildMonthCells(year, m);
      cells.forEach(cell => {
        const c = document.createElement('div');
        c.className = 'cal-mini-cell'
          + (cell.inMonth ? '' : ' muted')
          + (cell.date === today ? ' today' : '');
        c.textContent = cell.inMonth ? cell.day : '';
        const events = getEventsForDate(cell.date);
        if (events.length && cell.inMonth) {
          c.classList.add('has-events');
          c.style.setProperty('--dot-color', eventColorFor(events[0]));
          c.title = events.map(e => (e.time ? e.time + ' ' : '') + e.title).join('\n');
        }
        c.addEventListener('click', () => {
          if (!cell.inMonth) return;
          state.calendarView.month = m;
          state.calendarView.selected = cell.date;
          state.calendarView.mode = 'month';
          renderCalendar();
        });
        grid.appendChild(c);
      });
      mini.appendChild(grid);
      calendarGrid.appendChild(mini);
    }

    calendarDayPanel.hidden = true;
  }

  function renderWeekView() {
    const sel = state.calendarView.selected || todayIso();
    const base = new Date(sel + 'T00:00:00');
    const dow = (base.getDay() + 6) % 7;
    const monday = new Date(base);
    monday.setDate(base.getDate() - dow);

    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    const start = days[0];
    const end = days[6];
    const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
    const startLabel = start.toLocaleDateString(undefined, sameMonth ? { day: 'numeric' } : { day: 'numeric', month: 'short' });
    const endLabel = end.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    calendarTitle.textContent = `${startLabel} – ${endLabel}`;

    calendarGrid.className = 'calendar-grid week-mode';
    calendarGrid.innerHTML = '';

    const today = todayIso();
    days.forEach(d => {
      const iso = isoForDate(d);
      const col = document.createElement('div');
      col.className = 'cal-week-col';

      const head = document.createElement('div');
      head.className = 'cal-week-head' + (iso === today ? ' today' : '');
      const dayName = document.createElement('div');
      dayName.className = 'cal-week-day';
      dayName.textContent = d.toLocaleDateString(undefined, { weekday: 'short' });
      const dateNum = document.createElement('div');
      dateNum.className = 'cal-week-date';
      dateNum.textContent = d.getDate();
      head.appendChild(dayName);
      head.appendChild(dateNum);
      col.appendChild(head);

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'cal-week-add';
      addBtn.textContent = '+ Add';
      addBtn.addEventListener('click', () => promptCalendarEvent(null, iso));
      col.appendChild(addBtn);

      const list = document.createElement('div');
      list.className = 'cal-week-events';
      const events = getEventsForDate(iso);
      if (!events.length) {
        const empty = document.createElement('div');
        empty.className = 'cal-week-empty';
        empty.textContent = '—';
        list.appendChild(empty);
      } else {
        events.forEach(ev => {
          const item = document.createElement('div');
          item.className = 'cal-week-item' + (ev.isExam ? ' exam' : '');
          item.style.setProperty('--ev-color', eventColorFor(ev));
          const t = document.createElement('div');
          t.className = 'cal-week-time';
          t.textContent = ev.time || 'All day';
          const ti = document.createElement('div');
          ti.className = 'cal-week-title';
          ti.textContent = ev.title;
          item.appendChild(t);
          item.appendChild(ti);
          if (ev.notes) {
            const n = document.createElement('div');
            n.className = 'cal-week-notes';
            n.textContent = ev.notes;
            item.appendChild(n);
          }
          if (!ev.isExam) {
            item.style.cursor = 'pointer';
            item.addEventListener('click', () => promptCalendarEvent(ev, iso));
          }
          list.appendChild(item);
        });
      }
      col.appendChild(list);
      calendarGrid.appendChild(col);
    });

    calendarDayPanel.hidden = true;
  }

  function renderDayPanel() {
    const iso = state.calendarView.selected || todayIso();
    const d = new Date(iso + 'T00:00:00');
    const dateLabel = d.toLocaleDateString(undefined, {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    const events = getEventsForDate(iso);

    calendarDayPanel.innerHTML = `
      <div class="calendar-day-panel-header">
        <h3 class="calendar-day-panel-title"></h3>
        <button type="button" class="btn-primary" id="calAddEvent">+ Add event</button>
      </div>
      <div class="calendar-event-list" id="calEventList"></div>`;

    calendarDayPanel.querySelector('.calendar-day-panel-title').textContent = dateLabel;
    calendarDayPanel.querySelector('#calAddEvent').addEventListener('click', () => {
      promptCalendarEvent(null, iso);
    });

    const listEl = calendarDayPanel.querySelector('#calEventList');
    if (!events.length) {
      const empty = document.createElement('div');
      empty.className = 'fc-empty';
      empty.textContent = 'No events on this day. Add one above.';
      listEl.appendChild(empty);
      return;
    }

    events.forEach(ev => {
      const row = document.createElement('div');
      row.className = 'calendar-event-row' + (ev.isExam ? ' exam' : '');
      row.style.setProperty('--ev-color', eventColorFor(ev));
      const timeEl = document.createElement('div');
      timeEl.className = 'calendar-event-time';
      timeEl.textContent = ev.time || 'All day';
      row.appendChild(timeEl);

      const titleEl = document.createElement('div');
      titleEl.className = 'calendar-event-title';
      titleEl.textContent = ev.title;
      if (ev.notes) {
        const notesEl = document.createElement('span');
        notesEl.className = 'calendar-event-notes';
        notesEl.textContent = ev.notes;
        titleEl.appendChild(notesEl);
      }
      row.appendChild(titleEl);

      if (ev.isExam) {
        const badge = document.createElement('span');
        badge.className = 'calendar-event-badge';
        badge.textContent = 'Exam';
        badge.title = 'Manage from Settings or Home';
        row.appendChild(badge);
      } else {
        const actions = document.createElement('div');
        actions.className = 'calendar-event-actions';
        actions.innerHTML = `
          <button class="icon-btn" data-act="edit" title="Edit">✎</button>
          <button class="icon-btn danger" data-act="delete" title="Delete">×</button>`;
        actions.querySelector('[data-act="edit"]').addEventListener('click', () => promptCalendarEvent(ev, iso));
        actions.querySelector('[data-act="delete"]').addEventListener('click', () => {
          if (!window.confirm(`Delete "${ev.title}"?`)) return;
          deleteCalendarEvent(ev.id);
        });
        row.appendChild(actions);
      }

      listEl.appendChild(row);
    });
  }

  function addCalendarEvent({ title, date, time, notes, color }) {
    state.calendarEvents.push({
      id: newId(),
      title: title.trim(),
      date,
      time: (time || '').trim() || '',
      notes: (notes || '').trim() || '',
      color: color || 'ink'
    });
    save(); pushRemote(); renderCalendar();
  }
  function updateCalendarEvent(id, { title, date, time, notes, color }) {
    const ev = state.calendarEvents.find(e => e.id === id);
    if (!ev) return;
    ev.title = title.trim();
    ev.date = date;
    ev.time = (time || '').trim() || '';
    ev.notes = (notes || '').trim() || '';
    ev.color = color || ev.color || 'ink';
    save(); pushRemote(); renderCalendar();
  }
  function deleteCalendarEvent(id) {
    state.calendarEvents = state.calendarEvents.filter(e => e.id !== id);
    save(); pushRemote(); renderCalendar();
  }

  function promptCalendarEvent(existing, defaultDate) {
    openModal({
      title: existing ? 'Edit event' : 'New event',
      fields: [
        { name: 'title', label: 'Title', value: existing ? existing.title : '', required: true, placeholder: 'e.g. Study group' },
        { name: 'date',  label: 'Date',  value: existing ? existing.date  : (defaultDate || todayIso()), required: true, type: 'date' },
        { name: 'time',  label: 'Time (optional)', value: existing ? existing.time : '', type: 'time' },
        { name: 'notes', label: 'Notes (optional)', value: existing ? existing.notes : '', multiline: true },
        { name: 'color', label: 'Colour', value: existing ? (existing.color || 'ink') : 'ink', type: 'color-pick', options: CALENDAR_COLORS }
      ],
      onSave: (values) => {
        if (!values.title) { window.alert('Title is required.'); return false; }
        if (!values.date)  { window.alert('Date is required.');  return false; }
        const pwd = window.prompt(existing ? 'Enter password to save changes:' : 'Enter password to save event:');
        if (pwd === null) return false;
        if (pwd !== SAVE_PASSWORD) {
          window.alert('Incorrect password.');
          return false;
        }
        if (existing) {
          updateCalendarEvent(existing.id, values);
        } else {
          addCalendarEvent(values);
          state.calendarView.selected = values.date;
          const d = new Date(values.date + 'T00:00:00');
          state.calendarView.year = d.getFullYear();
          state.calendarView.month = d.getMonth();
        }
      }
    });
  }

  function calNav(delta) {
    const mode = state.calendarView.mode;
    if (mode === 'year') {
      state.calendarView.year += delta;
    } else if (mode === 'week') {
      const sel = state.calendarView.selected || todayIso();
      const d = new Date(sel + 'T00:00:00');
      d.setDate(d.getDate() + delta * 7);
      state.calendarView.selected = isoForDate(d);
      state.calendarView.year = d.getFullYear();
      state.calendarView.month = d.getMonth();
    } else {
      let m = state.calendarView.month + delta;
      let y = state.calendarView.year;
      if (m < 0) { m += 12; y -= 1; }
      if (m > 11) { m -= 12; y += 1; }
      state.calendarView.month = m;
      state.calendarView.year = y;
    }
    renderCalendar();
  }
  if (calPrevBtn) calPrevBtn.addEventListener('click', () => calNav(-1));
  if (calNextBtn) calNextBtn.addEventListener('click', () => calNav(1));
  if (calTodayBtn) calTodayBtn.addEventListener('click', () => {
    const t = new Date();
    state.calendarView.year = t.getFullYear();
    state.calendarView.month = t.getMonth();
    state.calendarView.selected = todayIso();
    renderCalendar();
  });
  document.querySelectorAll('.cal-mode-switch button[data-mode]').forEach(b => {
    b.addEventListener('click', () => {
      state.calendarView.mode = b.dataset.mode;
      renderCalendar();
    });
  });

  load();
  updateDirtyIndicator();
  render();
  // Initialise calendar view to today
  const _now = new Date();
  state.calendarView.year = _now.getFullYear();
  state.calendarView.month = _now.getMonth();
  state.calendarView.selected = todayIso();
  showView('home');
  setInterval(tick, 1000);
  fetchRemote();
  window.addEventListener('online', fetchRemote);
  } /* end initApp */

  if (isLoggedIn()) {
    mountAndInit();
    hideLoginGate();
  } else {
    showLoginGate();
  }
})();
</script>
</body>
</html>
